          cap1.rotation.x = Math.PI * 0.5;
          cap1.position.z = 1.12;
          const cap2 = cap1.clone();
          cap2.position.z = -1.12;
          staffGroup.add(cap1, cap2);

          const windRibbonMat = new THREE.MeshBasicMaterial({
            color: 0x38bdf8,
            transparent: true,
            opacity: 0.78,
            side: THREE.DoubleSide
          });
          const ribbon1 = new THREE.Mesh(new THREE.PlaneGeometry(0.12, 0.85), windRibbonMat);
          ribbon1.position.set(0, -0.42, 1.08);
          const ribbon2 = ribbon1.clone();
          ribbon2.position.set(0, -0.42, -1.08);
          staffGroup.add(ribbon1, ribbon2);

          weapons.staff = staffGroup;
          weapons.ribbons = [ribbon1, ribbon2];
        } else if (cfg.id === 'damen') {
          [armLObj.endMount, armRObj.endMount].forEach((mount, idx) => {
            const rev = new THREE.Group();
            const barrel = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.065, 0.28), goldTrimMat);
            barrel.position.set(0, -0.02, 0.14);
            const grip = new THREE.Mesh(new THREE.BoxGeometry(0.042, 0.13, 0.06), barkMat);
            grip.position.set(0, -0.07, 0.02);
            grip.rotation.x = 0.25;
            rev.add(barrel, grip);
            mount.add(rev);
            weapons[idx === 0 ? 'revL' : 'revR'] = rev;
          });
        } else if (cfg.id === 'khen') {
          [armLObj.endMount, armRObj.endMount].forEach((mount, idx) => {
            const dag = new THREE.Group();
            const hilt = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.16, 8), goldTrimMat);
            hilt.rotation.x = Math.PI * 0.5;
            const guard = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.025, 0.025), goldTrimMat);
            guard.position.z = 0.08;
            const blade = new THREE.Mesh(new THREE.ConeGeometry(0.036, 0.44, 4), accentMat);
            blade.rotation.x = Math.PI * 0.5;
            blade.position.z = 0.30;
            dag.add(hilt, guard, blade);
            mount.add(dag);
            weapons[idx === 0 ? 'dagL' : 'dagR'] = dag;
          });
        }

        // Elemental Aura Ring at feet
        const auraRing = new THREE.Mesh(
          new THREE.RingGeometry(0.45, 0.88, 28),
          new THREE.MeshBasicMaterial({
            color: cfg.hex,
            transparent: true,
            opacity: 0.0,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending
          })
        );
        auraRing.rotation.x = -Math.PI * 0.5;
        auraRing.position.y = 0.04;
        root.add(auraRing);

        // JM's Golden Sovereign Crown Halo (Acts 7–8)
        let crownHalo = null;
        if (cfg.id === 'jm') {
          crownHalo = new THREE.Group();
          crownHalo.position.set(0, 1.95, -0.18);
          crownHalo.visible = false;
          const haloMat = new THREE.MeshBasicMaterial({
            color: 0xfef08a,
            transparent: true,
            opacity: 0.92,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending
          });
          const outerRing = new THREE.Mesh(new THREE.RingGeometry(0.65, 0.76, 36), haloMat);
          const innerRing = new THREE.Mesh(new THREE.RingGeometry(0.42, 0.47, 28), haloMat);
          crownHalo.add(outerRing, innerRing);
          for (let sp = 0; sp < 8; sp++) {
            const ray = new THREE.Mesh(new THREE.PlaneGeometry(0.06, 0.48), haloMat);
            const a = (sp / 8) * Math.PI * 2;
            ray.position.set(Math.cos(a) * 0.92, Math.sin(a) * 0.92, 0);
            ray.rotation.z = a - Math.PI * 0.5;
            crownHalo.add(ray);
          }
          root.add(crownHalo);
        }

        return {
          ...cfg,
          root,
          squashGroup,
          hips,
          torso,
          head,
          armL: armLObj.rootPivot,
          elbowL: armLObj.midPivot,
          armR: armRObj.rootPivot,
          elbowR: armRObj.midPivot,
          legL: legLObj.rootPivot,
          kneeL: legLObj.midPivot,
          legR: legRObj.rootPivot,
          kneeR: legRObj.midPivot,
          browL,
          browR,
          eyeTex,
          cowboyHat,
          glassesGlint,
          auraRing,
          crownHalo,
          weapons,
          hp: 100,
          isKO: false,
          isActive: false
        };
      }

      const fighters = {};
      FIGHTER_CONFIGS.forEach((c) => {
        fighters[c.id] = createArticulatedFighter(c);
      });

      // ------------------------------------------------------------------------
      // 11. SIGNATURE ANIME VFX: SLASH ARCS, WATER SPLASHES, HIT SPARKS, SOLAR DRAGON
      // ------------------------------------------------------------------------
      const activeShockwaves = [];
      const shockwaveRingPool = [];
      for (let i = 0; i < 12; i++) {
        const ring = new THREE.Mesh(
          new THREE.RingGeometry(0.6, 1.0, 32),
          new THREE.MeshBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending
          })
        );
        ring.rotation.x = -Math.PI * 0.5;
        ring.visible = false;
        scene.add(ring);
        shockwaveRingPool.push(ring);
      }

      function spawnShockwave(x, z, maxRadius, colorHex = 0xfef08a, strength = 1.0) {
        activeShockwaves.push({ x, z, radius: 0.5, maxRadius, colorHex, strength, age: 0, maxAge: 0.65 });
      }

      // 3D Glowing Weapon / Kick Slash Arc Pool
      const slashArcPool = [];
      const slashGeo = new THREE.RingGeometry(1.05, 1.48, 24, 1, 0, Math.PI * 0.85);
      for (let i = 0; i < 16; i++) {
        const mesh = new THREE.Mesh(
          slashGeo,
          new THREE.MeshBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending
          })
        );
        mesh.visible = false;
        scene.add(mesh);
        slashArcPool.push({ mesh, life: 0, maxLife: 0.24 });
      }
      let slashCursor = 0;
      function spawnSlashArc(x, y, z, rx, ry, rz, scale, colorHex) {
        const s = slashArcPool[slashCursor % slashArcPool.length];
        slashCursor++;
        s.mesh.position.set(x, getTerrainHeight(x, z) + y, z);
        s.mesh.rotation.set(rx, ry, rz);
        s.mesh.scale.setScalar(scale);
        s.mesh.material.color.setHex(colorHex);
        s.mesh.material.opacity = 0.92;
        s.mesh.visible = true;
        s.life = 0.24;
      }

      // Directional Impact Hit-Spark & Water Droplet Pool
      const hitSparkPool = [];
      const sparkGeo = new THREE.ConeGeometry(0.055, 0.65, 5);
      sparkGeo.translate(0, 0.32, 0);
      for (let i = 0; i < 32; i++) {
        const mesh = new THREE.Mesh(
          sparkGeo,
          new THREE.MeshBasicMaterial({
            color: 0xfef08a,
            transparent: true,
            opacity: 0,
            blending: THREE.AdditiveBlending
          })
        );
        mesh.visible = false;
        scene.add(mesh);
        hitSparkPool.push({ mesh, vx: 0, vy: 0, vz: 0, life: 0, maxLife: 0.3 });
      }
      let sparkCursor = 0;
      function spawnHitSparks(x, y, z, colorHex, count = 7) {
        const baseY = getTerrainHeight(x, z) + y;
        for (let k = 0; k < count; k++) {
          const sp = hitSparkPool[sparkCursor % hitSparkPool.length];
          sparkCursor++;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.random() * Math.PI;
          const spd = 5.5 + Math.random() * 7.5;
          sp.vx = Math.sin(phi) * Math.cos(theta) * spd;
          sp.vy = Math.abs(Math.cos(phi)) * spd + 1.8;
          sp.vz = Math.sin(phi) * Math.sin(theta) * spd;
          sp.mesh.position.set(x, baseY, z);
          sp.mesh.quaternion.setFromUnitVectors(
            new THREE.Vector3(0, 1, 0),
            new THREE.Vector3(sp.vx, sp.vy, sp.vz).normalize()
          );
          sp.mesh.material.color.setHex(colorHex);
          sp.mesh.material.opacity = 1.0;
          sp.mesh.visible = true;
          sp.life = 0.3;
        }
      }

      // Afterimage Ghost Clone Pool
      const ghostPool = [];
      for (let i = 0; i < 18; i++) {
        const ghost = new THREE.Mesh(
          new THREE.CylinderGeometry(0.22, 0.28, 1.55, 8),
          new THREE.MeshBasicMaterial({
            color: 0x38bdf8,
            transparent: true,
            opacity: 0,
            blending: THREE.AdditiveBlending
          })
        );
        ghost.visible = false;
        scene.add(ghost);
        ghostPool.push({ mesh: ghost, life: 0 });
      }
      let ghostCursor = 0;
      function spawnAfterimage(x, y, z, rotY, colorHex) {
        const g = ghostPool[ghostCursor % ghostPool.length];
        ghostCursor++;
        g.mesh.position.set(x, getTerrainHeight(x, z) + y + 0.85, z);
        g.mesh.rotation.y = rotY;
        g.mesh.material.color.setHex(colorHex);
        g.mesh.material.opacity = 0.52;
        g.mesh.visible = true;
        g.life = 0.28;
      }

      // Damen's Golden Energy Lasso (Act 5)
      const goldenLasso = new THREE.Mesh(
        new THREE.TorusGeometry(0.55, 0.045, 8, 28),
        new THREE.MeshBasicMaterial({ color: 0xfacc15, transparent: true, opacity: 0.92, blending: THREE.AdditiveBlending })
      );
      goldenLasso.rotation.x = Math.PI * 0.5;
      goldenLasso.visible = false;
      scene.add(goldenLasso);

      // Khen's Dark-Violet Crescent Wave & Void Domain Pillar (Act 7)
      const violetCrescent = new THREE.Mesh(
        new THREE.TorusGeometry(2.2, 0.24, 8, 28, Math.PI * 1.15),
        new THREE.MeshBasicMaterial({ color: 0xa855f7, transparent: true, opacity: 0.92, blending: THREE.AdditiveBlending })
      );
      violetCrescent.visible = false;
      scene.add(violetCrescent);

      // JM's Golden Charging Aura Sphere (Act 7 buildup)
      const jmChargeSphere = new THREE.Mesh(
        new THREE.SphereGeometry(0.85, 18, 14),
        new THREE.MeshBasicMaterial({ color: 0xfef08a, transparent: true, opacity: 0.88, blending: THREE.AdditiveBlending })
      );
      jmChargeSphere.visible = false;
      scene.add(jmChargeSphere);

      // JM's Golden Solar Dragon Beam + Sculpted 3D Dragon Head (Act 7)
      const solarBeamGroup = new THREE.Group();
      solarBeamGroup.visible = false;
      scene.add(solarBeamGroup);

      const beamCore = new THREE.Mesh(
        new THREE.CylinderGeometry(0.55, 0.72, 18, 16, 1, true),
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.96, blending: THREE.AdditiveBlending })
      );
      beamCore.rotation.z = Math.PI * 0.5;
      beamCore.position.x = -9;
      solarBeamGroup.add(beamCore);

      const beamOuter = new THREE.Mesh(
        new THREE.CylinderGeometry(1.15, 1.45, 18, 16, 1, true),
        new THREE.MeshBasicMaterial({ color: 0xfacc15, transparent: true, opacity: 0.65, blending: THREE.AdditiveBlending, side: THREE.DoubleSide })
      );
      beamOuter.rotation.z = Math.PI * 0.5;
      beamOuter.position.x = -9;
      solarBeamGroup.add(beamOuter);

      const dragonHead = new THREE.Group();
      const dragonMat = new THREE.MeshBasicMaterial({ color: 0xfef08a, transparent: true, opacity: 0.92, blending: THREE.AdditiveBlending });
      const snout = new THREE.Mesh(new THREE.ConeGeometry(0.95, 2.2, 8), dragonMat);
      snout.rotation.z = Math.PI * 0.5;
      dragonHead.add(snout);
      const horn1 = new THREE.Mesh(new THREE.ConeGeometry(0.18, 1.4, 6), dragonMat);
      horn1.position.set(0.6, 0.7, 0.35);
      horn1.rotation.z = -0.6;
      const horn2 = horn1.clone();
      horn2.position.z = -0.35;
      dragonHead.add(horn1, horn2);
      solarBeamGroup.add(dragonHead);

      // Persistent Scorched-Earth Craters & Beam Trail
      const scorchedCrater = new THREE.Mesh(
        new THREE.CircleGeometry(2.6, 24),
        new THREE.MeshBasicMaterial({ color: 0x1c1917, transparent: true, opacity: 0.82 })
      );
      scorchedCrater.rotation.x = -Math.PI * 0.5;
      scorchedCrater.position.set(2.5, 0.05, 1.2);
      scorchedCrater.visible = false;
      scene.add(scorchedCrater);

      const beamGroundScar = new THREE.Mesh(
        new THREE.PlaneGeometry(16.5, 2.1),
        new THREE.MeshBasicMaterial({ color: 0xf59e0b, transparent: true, opacity: 0.78, blending: THREE.AdditiveBlending })
      );
      beamGroundScar.rotation.x = -Math.PI * 0.5;
      beamGroundScar.position.set(-1.5, 0.06, 0);
      beamGroundScar.visible = false;
      scene.add(beamGroundScar);

      // Celebratory Act 8 Fireworks
      const fireworks = [];
      const fwColors = [0xfacc15, 0x38bdf8, 0xf43f5e, 0xa855f7, 0xf59e0b];
      for (let f = 0; f < 6; f++) {
        const fwGeo = new THREE.BufferGeometry();
        const fwPts = new Float32Array(48 * 3);
        const fwDirs = [];
        for (let p = 0; p < 48; p++) {
          const u = Math.random();
          const v = Math.random();
          const theta = 2 * Math.PI * u;
          const phi = Math.acos(2 * v - 1);
          fwDirs.push(new THREE.Vector3(Math.sin(phi) * Math.cos(theta), Math.cos(phi), Math.sin(phi) * Math.sin(theta)));
        }
        fwGeo.setAttribute('position', new THREE.BufferAttribute(fwPts, 3));
        const fwPoints = new THREE.Points(
          fwGeo,
          new THREE.PointsMaterial({ color: fwColors[f % fwColors.length], size: 0.35, transparent: true, opacity: 0, blending: THREE.AdditiveBlending })
        );
        scene.add(fwPoints);
        fireworks.push({
          points: fwPoints,
          dirs: fwDirs,
          origin: new THREE.Vector3(-20 + f * 8, 16 + (f % 2) * 4, -26 - (f % 3) * 5),
          triggerTime: 110.5 + f * 1.2
        });
      }

      // ------------------------------------------------------------------------
      // 12. HUD SETUP & 120-SECOND TIMELINE / CAMERA CONTROLS
      // ------------------------------------------------------------------------
      const fighterHudRow = document.getElementById('fighter-hud-row');
      FIGHTER_CONFIGS.forEach((cfg) => {
        const card = document.createElement('div');
        card.id = `hud-card-${cfg.id}`;
        card.className = 'glass-panel rounded-xl p-1.5 sm:p-2 border transition-all duration-200 relative overflow-hidden';
        card.style.borderColor = `${cfg.color}55`;
        card.innerHTML = `
          <div class="flex items-center justify-between gap-1 mb-1">
            <span class="font-display font-extrabold text-[11px] sm:text-sm tracking-wide truncate" style="color:${cfg.color}">${cfg.name}</span>

      const nodeServerSource = `#!/usr/bin/env node
/**
 * SQUAD CLASH 3D — Golden Meadow Edition (120s Director's Cut)
 * Zero-Dependency Node.js Static HTTP Server
 * Usage: node squad-clash-server.js [port]
 */
const http = require('http');
const fs = require('fs');
const path = require('path');

const PORT = parseInt(process.argv[2] || process.env.PORT || '3000', 10);
const PUBLIC_DIR = __dirname;

const MIME_TYPES = {
  '.html': 'text/html; charset=utf-8',
  '.js':   'application/javascript; charset=utf-8',
  '.css':  'text/css; charset=utf-8',
  '.json': 'application/json; charset=utf-8',
  '.svg':  'image/svg+xml',
  '.png':  'image/png',
  '.ico':  'image/x-icon'
};

const server = http.createServer((req, res) => {
  const safePath = decodeURIComponent((req.url || '/').split('?')[0]);
  const relPath = safePath === '/' ? 'index.html' : safePath.replace(/^\\/+/, '');
  const filePath = path.join(PUBLIC_DIR, relPath);

  if (!filePath.startsWith(PUBLIC_DIR)) {
    res.writeHead(403, { 'Content-Type': 'text/plain' });
    return res.end('403 Forbidden');
  }

  fs.readFile(filePath, (err, content) => {
    if (err) {
      res.writeHead(err.code === 'ENOENT' ? 404 : 500, { 'Content-Type': 'text/plain' });
      return res.end(err.code === 'ENOENT' ? '404 Not Found' : '500 Internal Server Error');
    }
    const ext = path.extname(filePath).toLowerCase();
    res.writeHead(200, {
      'Content-Type': MIME_TYPES[ext] || 'application/octet-stream',
      'Cache-Control': 'no-cache'
    });
    res.end(content);
  });
});

server.listen(PORT, () => {
  console.log(\`\\n🌾 SQUAD CLASH 3D — Golden Meadow Edition running at http://localhost:\${PORT}\\n\`);
});
`;

      function poseFighter(f, opts) {
        const {
          x = f.startX,
          y = 0,
          z = 0,
          rotY = 0,
          leanX = 0,
          leanZ = 0,
          hipY = 0,
          torsoPitch = 0,
          torsoYaw = 0,
          torsoRoll = 0,
          headYaw = 0,
          headPitch = 0,
          armLAngle = [-0.45, 0, -0.22],
          elbowL = -0.85,
          armRAngle = [-0.45, 0, 0.22],
          elbowR = -0.85,
          legLAngle = [-0.15, 0, -0.08],
          kneeL = 0.25,
          legRAngle = [0.15, 0, 0.08],
          kneeR = 0.25,
          eyeState = 'normal',
          auraOpacity = 0,
          squash = 1.0,
          active = false
        } = opts;

        const groundY = getTerrainHeight(x, z);
        f.root.position.set(x, groundY + y, z);
        f.root.rotation.set(leanX, rotY, leanZ);

        const sy = squash;
        const sxz = 1 / Math.sqrt(Math.max(0.45, sy));
        f.squashGroup.scale.set(sxz, sy, sxz);

        f.hips.position.y = 0.92 + hipY;
        f.torso.rotation.set(torsoPitch, torsoYaw, torsoRoll);
        f.head.rotation.set(headPitch - torsoPitch * 0.65, headYaw - torsoYaw * 0.75, -torsoRoll * 0.5);

        f.armL.rotation.set(armLAngle[0], armLAngle[1], armLAngle[2]);
        f.elbowL.rotation.x = elbowL;
        f.armR.rotation.set(armRAngle[0], armRAngle[1], armRAngle[2]);
        f.elbowR.rotation.x = elbowR;

        f.legL.rotation.set(legLAngle[0], legLAngle[1], legLAngle[2]);
        f.kneeL.rotation.x = kneeL;
        f.legR.rotation.set(legRAngle[0], legRAngle[1], legRAngle[2]);
        f.kneeR.rotation.x = kneeR;

        if (f.eyeTex.userData.drawState(eyeState)) {
          f.eyeTex.needsUpdate = true;
        }

        f.auraRing.material.opacity = auraOpacity;
        f.auraRing.scale.setScalar(1.0 + Math.sin(simTime * 10) * 0.12);
        f.isActive = active;

        if (f._sashRibbons) {
          const flutter = Math.sin(simTime * 10 + x) * 0.24;
          f._sashRibbons[0].rotation.x = 0.28 + flutter + Math.max(0, y * 0.12);
          f._sashRibbons[1].rotation.x = 0.28 - flutter + Math.max(0, y * 0.12);
        }
        if (f._coatTail) {
          f._coatTail.rotation.x = 0.24 + Math.sin(simTime * 9 + z) * 0.18;
        }
        if (f._idBadge) {
          f._idBadge.rotation.x = -leanX * 0.8 + Math.sin(simTime * 7) * 0.08;
        }
      }

      function updateEnvironmentalDestruction(t) {
        // 1) Western Ruined Temple Archway & Pillars shatter at t = 40.5s
        const templeBreakT = t - 40.5;
        templeBlocks.forEach((b) => {
          if (!b.isDestructible || templeBreakT <= 0) {
            b.mesh.position.copy(b.origin);
            b.mesh.rotation.set(0, 0, 0);
          } else {
            const dtB = Math.min(templeBreakT, 3.5);
            const nx = b.origin.x + b.vx * dtB;
            const nz = b.origin.z + b.vz * dtB;
            const ground = getTerrainHeight(nx, nz) + b.halfH;
            const rawY = b.origin.y + b.vy * dtB - 0.5 * 14.5 * dtB * dtB;
            const ny = Math.max(ground, rawY);
            const settled = rawY <= ground;
            b.mesh.position.set(nx, ny, nz);
            const spinT = settled ? Math.min(dtB, 1.1) : dtB;
            b.mesh.rotation.set(b.rx * spinT, 0.4 * spinT, b.rz * spinT);
          }
        });

        // 2) Eastern Highland Cliff Slabs avalanche at t = 56.5s
        const cliffBreakT = t - 56.5;
        cliffSlabs.forEach((s) => {
          if (cliffBreakT <= 0) {
            s.mesh.position.copy(s.origin);
            s.mesh.rotation.set(0, 0, 0);
          } else {
            const dtC = Math.min(cliffBreakT, 3.8);
            const nx = s.origin.x + s.vx * dtC;
            const nz = s.origin.z + s.vz * dtC;
            const ground = getTerrainHeight(nx, nz) + s.rad * 0.65;
            const rawY = s.origin.y + s.vy * dtC - 0.5 * 14.0 * dtC * dtC;
            const ny = Math.max(ground, rawY);
            const settled = rawY <= ground;
            s.mesh.position.set(nx, ny, nz);
            const spinT = settled ? Math.min(dtC, 1.2) : dtC;
            s.mesh.rotation.set(s.rx * spinT, 0.3 * spinT, s.rz * spinT);
          }
        });

        // 3) Shattering Field Boulder (Prime shatters at t = 46.2s)
        if (t < primeShatterBoulder.shatterTime) {
          primeShatterBoulder.mesh.visible = true;
          primeShatterBoulder.shards.forEach((sh) => (sh.mesh.visible = false));
        } else {
          primeShatterBoulder.mesh.visible = false;
          const dtS = Math.min(t - primeShatterBoulder.shatterTime, 3.0);
          primeShatterBoulder.shards.forEach((sh) => {
            sh.mesh.visible = true;
            const nx = primeShatterBoulder.origin.x + sh.vx * dtS;
            const nz = primeShatterBoulder.origin.z + sh.vz * dtS;
            const ground = getTerrainHeight(nx, nz) + 0.18;
            const sy = Math.max(ground, primeShatterBoulder.origin.y + sh.vy * dtS - 0.5 * 14.0 * dtS * dtS);
            sh.mesh.position.set(nx, sy, nz);
            sh.mesh.rotation.set(sh.rx * dtS, 0, sh.rz * dtS);
          });
        }

        // 4) Rolling Boulder pushed across field in Act 4 (49.5s – 52.0s)
        const rollP = smoothstep(49.5, 52.0, t);
        const rx = lerp(rollingBoulder.origin.x, -4.5, rollP);
        const rz = lerp(rollingBoulder.origin.z, -1.5, rollP);
        rollingBoulder.mesh.position.set(rx, getTerrainHeight(rx, rz) + rollingBoulder.radius * 0.55, rz);
        rollingBoulder.mesh.rotation.z = rollP * Math.PI * 3.5;

        // 5) Persistent Ground Craters & Solar Dragon Canyon Scar
        scorchedCrater.visible = t >= 47.5;
        beamGroundScar.visible = t >= 106.2;
      }

      function updateSimulation(dt, isScrub = false) {
        const t = simTime;

        const currentAct = ACTS.find((a) => t >= a.start && t <= a.end) || ACTS[ACTS.length - 1];
        document.getElementById('act-badge-text').textContent = currentAct.label;
        document.getElementById('time-display').textContent = `${t.toFixed(1).padStart(5, '0')}s`;
        timelineScrubber.value = t.toFixed(2);

        // Reset transient VFX visibility per frame
        goldenLasso.visible = false;
        violetCrescent.visible = false;
        jmChargeSphere.visible = false;
        solarBeamGroup.visible = false;
        actionPointLight.intensity = 0;
        document.getElementById('champion-banner').classList.add('hidden');
        if (fighters.khen.glassesGlint) fighters.khen.glassesGlint.visible = false;
        if (fighters.jm.crownHalo) fighters.jm.crownHalo.visible = false;

        // Atmosphere Sky Storm Factor (Acts 6–7 twilight storm, Act 8 golden sunrise burst)
        let stormFactor = 0.0;
        if (t >= 76.0 && t < 78.2) {
          stormFactor = smoothstep(76.0, 78.2, t);
        } else if (t >= 78.2 && t < 110.0) {
          stormFactor = 1.0;
        } else if (t >= 110.0 && t < 112.2) {
          stormFactor = 1.0 - smoothstep(110.0, 112.2, t);
        }
        skyUniforms.uStormFactor.value = stormFactor;
        skyUniforms.uTime.value = t;

        const goldenFog = new THREE.Color('#fde68a');
        const stormFog = new THREE.Color('#3b0764');
        fog.color.copy(goldenFog).lerp(stormFog, stormFactor * 0.78);
        sunLight.intensity = lerp(1.85, 0.72, stormFactor) + (t >= 110.0 ? 0.45 : 0);
        godRayMeshes.forEach((ray) => {
          ray.material.opacity = lerp(0.068, 0.008, stormFactor) + (t >= 110.0 ? 0.045 : 0);
        });
        cloudMaterials.forEach((cm) => {
          cm.color.setHex(0xfff7ed).lerp(new THREE.Color(0x311042), stormFactor * 0.85);
          cm.emissive.setHex(0xfbbf24).lerp(new THREE.Color(0x7e22ce), stormFactor);
        });

        // Deterministic Fighter HP & KO States across 120s
        FIGHTER_CONFIGS.forEach((cfg) => {
          const f = fighters[cfg.id];
          f.isKO = cfg.koTime !== null && t >= cfg.koTime;
          if (cfg.id === 'marjohn') f.hp = t < 38.0 ? 100 : t < 42.2 ? lerp(100, 0, (t - 38.0) / 4.2) : 0;
          if (cfg.id === 'prime')   f.hp = t < 54.0 ? 100 : t < 58.2 ? lerp(100, 0, (t - 54.0) / 4.2) : 0;
          if (cfg.id === 'damen')   f.hp = t < 71.0 ? 100 : t < 75.0 ? lerp(100, 0, (t - 71.0) / 4.0) : 0;
          if (cfg.id === 'khen')    f.hp = t < 104.5 ? 100 : t < 109.0 ? lerp(100, 0, (t - 104.5) / 4.5) : 0;
          if (cfg.id === 'jm')      f.hp = t < 88.0 ? 100 : t < 103.0 ? lerp(100, 68, (t - 88.0) / 15.0) : 74;
        });

        // Update 3D Environmental Destruction
        updateEnvironmentalDestruction(t);

        // Damen's Cowboy Hat (detaches at t = 72.8s in Act 5 and lands on boulder)
        if (fighters.damen.cowboyHat) {
          if (t < 72.8) {

              fighters.damen.head.add(fighters.damen.cowboyHat);

            fighters.damen.cowboyHat.rotation.set(Math.sin(t * 4) * 0.05, 0, Math.cos(t * 3) * 0.04);

            );
            fighters.damen.cowboyHat.rotation.set(ht * Math.PI * 4, ht * Math.PI * 6, 0.14 * ht);

        let camDest = new THREE.Vector3(0, 4.2, 16.5);
        let lookDest = new THREE.Vector3(0, 1.3, 0);

        // ======================================================================
        // ACT 1 (0.0s – 10.0s): INDIVIDUAL CHARACTER INTRODUCTIONS
        // ======================================================================
        if (t < 10.0) {
          // 0.0–2.0s: MARJOHN glides down on swirling Azure Wind currents onto Western Temple plaza

        // ======================================================================

        else if (t < 26.0) {

            poseFighter(fighters.prime, {

              if (fighters.marjohn.weapons.staff) fighters.marjohn.weapons.staff.rotation.y = t * 24;

              const pursueP = smoothstep(1.0, 5.5, phase);
              const strideJ = getRunStridePose(t * 14, (1 - pursueP) * 0.9);
              poseFighter(fighters.jm, {

                  y: lerp(1.6, 0.16, knockP) + Math.sin(knockP * Math.PI) * 2.2,
                  z: lerp(-8.5, 6.2, knockP),
                  rotY: -0.8,
                  leanX: -1.42 - knockP * Math.PI * 2,
                  eyeState: 'shock',
                  auraOpacity: 0.35,
                  active: true
                });
              }

              camDest.set(4.5, 3.6, 12.2);
              lookDest.set(lerp(2.0, 7.5, knockP), 1.4, lerp(-8.5, 6.2, knockP));
            }
          }
        }

        // ======================================================================
        // ACT 6 (76.0s – 94.0s): KHEN VS. JM RIVALRY (TWILIGHT STORM & GLASSES GLINT)
        // ======================================================================
        else if (t < 94.0) {
          poseFighter(fighters.marjohn, getKOPose(-19.2, -3.5, 1.57));
          poseFighter(fighters.prime,   getKOPose(18.2, -2.0, 1.57));
          poseFighter(fighters.damen,   getKOPose(7.5, 6.2, -0.8));

          if (t < 81.5) {
            // Dramatic atmospheric shift + close-up on Khen's white glasses lens-glint
            if (fighters.khen.glassesGlint && t >= 78.2 && t <= 80.4) {
              fighters.khen.glassesGlint.visible = true;
              const gs = Math.sin(((t - 78.2) / 2.2) * Math.PI) * 1.55;
              fighters.khen.glassesGlint.scale.setScalar(Math.max(0.01, gs));
              if (t >= 78.4 && t <= 78.55 && !isScrub) {
                triggerMilestone('act6-khen-glint', () => {
                  audioEngine.playEvent('khen-glint-sfx', 'whoosh');
                });
              }
            }

            poseFighter(fighters.khen, {
              ...getMartialGuardPose(t, 0.2, 'daggers'),
              x: -4.2,
              z: 0,
              rotY: 1.57,
              eyeState: 'fierce',
              auraOpacity: 0.88,
              active: true,
              armRAngle: t >= 78.0 && t <= 80.5 ? [-2.15, 0.32, 0.1] : [-0.65, -0.32, 0.35],
              elbowR: t >= 78.0 && t <= 80.5 ? -1.65 : -1.42
            });
            poseFighter(fighters.jm, {
              ...getMartialGuardPose(t, 1.5),
              x: 4.2,
              z: 0,
              rotY: -1.57,
              eyeState: 'fierce',
              auraOpacity: 0.88,
              active: true
            });

            if (t < 80.2) {
              camDest.set(-2.5, 1.85, 2.7);
              lookDest.set(-4.2, 1.68, 0);
            } else {
              camDest.set(0, 2.9, 10.8);
              lookDest.set(0, 1.3, 0);
            }
          } else {
            // 81.5s – 94.0s: Supersonic Violet vs Gold flash-step clashes across central crater & temple steps!
            const stepT = (t - 81.5) * 3.8;
            const cx = Math.sin(stepT * 0.95) * 5.2;
            const cy = Math.abs(Math.sin(stepT * 1.4)) * 1.8;
            const cz = Math.cos(stepT * 0.85) * 3.2;
            const cyclePhase = stepT % 2.0;

            const clashBucket = Math.floor(stepT);
            if (!isScrub) {
              triggerMilestone(`act6-clash-${clashBucket}`, () => {
                const isGold = clashBucket % 2 === 0;
                spawnShockwave(cx, cz, 5.5, isGold ? 0xfacc15 : 0xa855f7, 0.95);
                spawnAfterimage(cx - 0.6, cy, cz, 1.57, 0xa855f7);
                spawnAfterimage(cx + 0.6, cy, cz, -1.57, 0xfacc15);
                spawnSlashArc(cx, cy + 1.25, cz, Math.PI * 0.42, stepT * 2, 0.25, 1.35, isGold ? 0xfacc15 : 0xa855f7);
                spawnHitSparks(cx, cy + 1.25, cz, 0xfef08a, 8);
                audioEngine.playEvent(`rivalry-clash-${clashBucket}`, 'clash');
              });
            }

            actionPointLight.color.setHex(clashBucket % 2 === 0 ? 0xfacc15 : 0xa855f7);
            actionPointLight.position.set(cx, cy + 1, cz);
            actionPointLight.intensity = 4.5;

            const isLowSweep = cyclePhase >= 1.0;
            poseFighter(fighters.khen, {
              x: cx - 0.65,
              y: isLowSweep ? 0 : cy,
              z: cz,
              rotY: 1.57 + (isLowSweep ? cyclePhase * 3.1 : 0),
              hipY: isLowSweep ? -0.35 : -0.1,
              leanZ: isLowSweep ? 0.52 : -0.25,
              torsoYaw: 0.6,
              eyeState: 'fierce',
              auraOpacity: 0.95,
              active: true,
              armLAngle: [-1.5, -0.3, -0.3],
              elbowL: -0.25,
              armRAngle: [-1.5, 0.3, 0.3],
              elbowR: -0.25,
              thighL: [-0.45, 0, -0.15],
              kneeL: isLowSweep ? 1.35 : 0.65,
              thighR: isLowSweep ? [-1.45, 0, 0.25] : [0.45, 0, 0.15],
              kneeR: 0.15
            });

            poseFighter(fighters.jm, {
              x: cx + 0.65,
              y: isLowSweep ? 1.35 : cy,
              z: cz,
              rotY: -1.57 - (isLowSweep ? 0.85 : 0),
              leanZ: isLowSweep ? -0.45 : 0.2,
              torsoYaw: -0.55,
              eyeState: 'fierce',
              auraOpacity: 0.95,
              active: true,
              armLAngle: [-1.1, 0.4, -0.2],
              elbowL: -1.25,
              armRAngle: [-1.3, -0.3, 0.2],
              elbowR: -0.35,
              thighL: [-0.65, 0, -0.1],
              kneeL: 1.15,
              thighR: isLowSweep ? [-1.72, 0, 0.35] : [0.35, 0, 0.15],
              kneeR: isLowSweep ? 0.12 : 0.55
            });

            camDest.set(cx * 0.45, 3.4, 11.6);
            lookDest.set(cx, cy + 0.85, cz);
          }
        }

        // ======================================================================
        // ACT 7 (94.0s – 110.0s): THE FINAL CLASH (EARNED BUILDUP & SOLAR DRAGON BEAM)
        // ======================================================================
        else if (t < 110.0) {
          poseFighter(fighters.marjohn, getKOPose(-19.2, -3.5, 1.57));
          poseFighter(fighters.prime,   getKOPose(18.2, -2.0, 1.57));
          poseFighter(fighters.damen,   getKOPose(7.5, 6.2, -0.8));

          // Phase A (94.0–101.0s): High-altitude aerial duel & Khen's Dark-Violet Crescent Barrage
          // Phase B (101.0–105.0s): JM awakens Golden Sovereign Crown Halo & charges Solar Dragon Sphere
          // Phase C (105.0–110.0s): Full-scale Solar Dragon Beam finisher -> KHEN KO at 109.0s!
          const jmAscend = smoothstep(95.0, 101.5, t);
          const jmY = jmAscend * 3.4;

          if (fighters.jm.crownHalo && t >= 100.5) {
            fighters.jm.crownHalo.visible = true;
            fighters.jm.crownHalo.rotation.z = t * 1.8;
            const hs = smoothstep(100.5, 102.0, t);
            fighters.jm.crownHalo.scale.setScalar(hs);
          }

          if (t >= 101.2 && t <= 101.4 && !isScrub) {
            triggerMilestone('jm-halo-charge', () => {
              spawnShockwave(6.2, 0, 11.0, 0xfacc15, 1.2);
              audioEngine.playEvent('jm-charge-sfx', 'charge');
            });
          }

          // Charging Golden Sphere between JM's hands (101.5s – 105.0s)
          if (t >= 101.5 && t < 105.0) {
            jmChargeSphere.visible = true;
            const cs = smoothstep(101.5, 104.8, t) * (1.1 + Math.sin(t * 28) * 0.14);
            jmChargeSphere.position.set(5.4, jmY + 1.15, 0);
            jmChargeSphere.scale.setScalar(Math.max(0.05, cs));
            actionPointLight.color.setHex(0xfacc15);
            actionPointLight.position.set(5.4, jmY + 1.15, 0);
            actionPointLight.intensity = 4.2;
          }

          // Khen's Dark-Violet Crescent Wave (97.5s – 106.2s)
          if (t >= 97.5 && t < 106.2) {
            violetCrescent.visible = true;
            const vp = clamp((t - 97.5) / 7.5, 0, 1);
            violetCrescent.position.set(lerp(-5.8, 3.8, vp), 1.4 + vp * 1.7, 0);
            violetCrescent.rotation.y = Math.PI * 0.5;
            violetCrescent.scale.setScalar(1.0 + vp * 0.85);
          }

          // JM unleashes the Golden Solar Dragon Beam at t = 105.0s!
          if (t >= 105.0) {
            solarBeamGroup.visible = true;
            const bp = clamp((t - 105.0) / 0.65, 0, 1);
            solarBeamGroup.position.set(5.4, jmY + 1.15, 0);
            solarBeamGroup.rotation.z = 0.25;
            solarBeamGroup.scale.set(bp, 1.0 + Math.sin(t * 35) * 0.12, 1.0 + Math.cos(t * 35) * 0.12);
            dragonHead.position.set(-14.5 * bp, Math.sin(t * 24) * 0.25, Math.cos(t * 24) * 0.25);

            actionPointLight.color.setHex(0xfacc15);
            actionPointLight.position.set(-1.5, 2.2, 0);
            actionPointLight.intensity = 7.8;

            if (t >= 105.02 && t <= 105.15 && !isScrub) {
              triggerMilestone('solar-dragon-beam-sfx', () => {
                audioEngine.playEvent('solar-dragon-beam', 'beam');
              });
            }
            if (t >= 105.85 && t <= 106.0 && !isScrub) {
              triggerCallout('solar-dragon', 'SOLAR DRAGON BEAM!', '#facc15', true);
              triggerMilestone('solar-beam-wave', () => {
                spawnShockwave(-2.0, 0, 18.5, 0xfacc15, 1.6);
                spawnHitSparks(-5.8, 1.3, 0, 0xfacc15, 16);
              });
            }
            if (t >= 108.95 && t <= 109.1 && !isScrub) {
              triggerCallout('khen-ko', 'KHEN KO!', '#a855f7', true);
              audioEngine.playEvent('khen-ko-sfx', 'ko');
            }
          }

          const khenKnock = t >= 106.4 ? clamp((t - 106.4) / 1.8, 0, 1) : 0;
          if (t >= 109.0) {
            poseFighter(fighters.khen, getKOPose(-9.8, 0, 1.57));
          } else {
            poseFighter(fighters.khen, {
              x: lerp(-5.8, -9.8, khenKnock),
              y: khenKnock * 0.16,
              z: 0,
              rotY: 1.57,
              leanX: khenKnock > 0 ? -1.4 : 0.28,
              torsoPitch: 0.25,
              eyeState: t >= 105.8 ? 'shock' : 'fierce',
              auraOpacity: 0.92,
              active: true,
              armLAngle: [-1.45, -0.35, -0.25],
              elbowL: -0.3,
              armRAngle: [-1.45, 0.35, 0.25],
              elbowR: -0.3,
              thighL: [-0.45, 0, -0.15],
              kneeL: 0.65,
              thighR: [0.4, 0, 0.15],
              kneeR: 0.55
            });
          }

          const isFiring = t >= 105.0;
          poseFighter(fighters.jm, {
            x: 6.2,
            y: jmY,
            z: 0,
            rotY: -1.57,
            leanX: isFiring ? 0.24 : -0.18,
            torsoYaw: isFiring ? 0 : 0.55,
            eyeState: 'fierce',
            auraOpacity: 1.0,
            active: true,
            armLAngle: isFiring ? [-1.57, 0.12, -0.14] : [-0.85, 0.55, -0.3],
            elbowL: isFiring ? -0.12 : -1.45,
            armRAngle: isFiring ? [-1.57, -0.12, 0.14] : [-0.85, -0.55, 0.3],
            elbowR: isFiring ? -0.12 : -1.45,
            thighL: [-0.55, 0, -0.15],
            kneeL: 0.85,
            thighR: [0.35, 0, 0.15],
            kneeR: 0.45
          });

          if (t < 101.0) {
            camDest.set(0, 4.5, 16.0);
            lookDest.set(0, 2.0, 0);
          } else if (t < 105.0) {
            camDest.set(3.2, jmY + 1.8, 6.2);
            lookDest.set(6.0, jmY + 1.25, 0);
          } else {
            camDest.set(0.2, 4.4, 15.8);
            lookDest.set(-0.5, 1.8, 0);
          }
        }

        // ======================================================================
        // ACT 8 (110.0s – 120.0s): CHAMPION JM — GOLDEN SUNRISE & VICTORY POSE
        // ======================================================================
        else {
          poseFighter(fighters.marjohn, getKOPose(-19.2, -3.5, 1.57));
          poseFighter(fighters.prime,   getKOPose(18.2, -2.0, 1.57));
          poseFighter(fighters.damen,   getKOPose(7.5, 6.2, -0.8));
          poseFighter(fighters.khen,    getKOPose(-9.8, 0, 1.57));

          document.getElementById('champion-banner').classList.remove('hidden');
          if (t >= 110.1 && t <= 110.3 && !isScrub) {
            triggerMilestone('champion-fanfare', () => {
              audioEngine.playEvent('champion-fanfare', 'victory');
              spawnShockwave(0, 0, 16.0, 0xfacc15, 1.15);
            });
          }

          const descP = smoothstep(110.0, 112.5, t);
          const jmX = lerp(6.2, 0, descP);
          const jmY = lerp(3.4, 0, descP);

          if (fighters.jm.crownHalo) {
            fighters.jm.crownHalo.visible = true;
            fighters.jm.crownHalo.rotation.z = t * 1.1;
            fighters.jm.crownHalo.scale.setScalar(1.08 + Math.sin(t * 4) * 0.05);
          }

          poseFighter(fighters.jm, {
            x: jmX,
            y: jmY,
            z: 0,
            rotY: lerp(-1.57, 0.12, descP),
            leanX: -0.05,
            leanZ: 0.04,
            hipY: -0.04,
            torsoYaw: -0.14,
            headYaw: 0.12,
            eyeState: 'normal',
            auraOpacity: 0.78,
            active: true,
            // Signature Double-Finger-Gun Smirk Pose!
            armLAngle: [-1.42, 0.25, -0.22],
            elbowL: -0.35,
            armRAngle: [-1.48, -0.22, 0.18],
            elbowR: -0.32,
            thighL: [-0.18, 0.12, -0.10],
            kneeL: 0.28,
            thighR: [0.16, -0.12, 0.12],
            kneeR: 0.24
          });

          // Wide battlefield aftermath orbit revealing damaged ruins, cliff rubble, scorched scar & Champion JM
          const orbitWin = (t - 110.0) * 0.22;
          const camRad = lerp(12.5, 5.4, smoothstep(110.0, 114.5, t));
          camDest.set(Math.sin(orbitWin) * camRad, lerp(4.8, 2.05, smoothstep(110.0, 114.5, t)), Math.cos(orbitWin) * camRad);
          lookDest.set(0, 1.32, 0);
        }

        // Update Fighter HUD Cards
        FIGHTER_CONFIGS.forEach((cfg) => {
          const f = fighters[cfg.id];
          const card = document.getElementById(`hud-card-${cfg.id}`);
          const hpBar = document.getElementById(`hud-hp-${cfg.id}`);
          const hpNum = document.getElementById(`hud-hp-num-${cfg.id}`);
          const koBadge = document.getElementById(`hud-ko-${cfg.id}`);

          hpBar.style.width = `${Math.round(f.hp)}%`;
          hpNum.textContent = `${Math.round(f.hp)}%`;
          if (f.isKO) {
            koBadge.classList.remove('hidden');
            card.style.opacity = '0.52';
            card.style.transform = 'scale(0.97)';
          } else {
            koBadge.classList.add('hidden');
            card.style.opacity = '1.0';
            card.style.transform = f.isActive ? 'scale(1.03)' : 'scale(1.0)';
            card.style.boxShadow = f.isActive ? `0 0 18px ${cfg.color}55` : '';
          }
        });

        // Update Camera Position according to Selected Mode ('auto' | 'orbit' | 'jm')
        camShakeSpring.update(dt);
        const shakeOffset = (Math.random() - 0.5) * camShakeSpring.value;

        if (cameraMode === 'auto') {
          camPosSpring.setTarget(camDest.x, camDest.y, camDest.z);
          camLookSpring.setTarget(lookDest.x, lookDest.y, lookDest.z);
          camPosSpring.update(dt);
          camLookSpring.update(dt);
          camera.position.set(
            camPosSpring.x.value + shakeOffset,
            camPosSpring.y.value + shakeOffset * 0.7,
            camPosSpring.z.value
          );
          camera.lookAt(camLookSpring.x.value, camLookSpring.y.value, camLookSpring.z.value);
        } else if (cameraMode === 'orbit') {
          const r = orbitState.radius;
          const sinPhi = Math.sin(orbitState.phi);
          const cosPhi = Math.cos(orbitState.phi);
          camera.position.set(
            orbitState.target.x + r * sinPhi * Math.sin(orbitState.theta) + shakeOffset,
            orbitState.target.y + r * cosPhi,
            orbitState.target.z + r * sinPhi * Math.cos(orbitState.theta)
          );
          camera.lookAt(orbitState.target);
        } else if (cameraMode === 'jm') {
          const jmPos = fighters.jm.root.position;
          const r = 6.8;
          camera.position.set(
            jmPos.x + Math.sin(orbitState.theta + 0.35) * r + shakeOffset,
            jmPos.y + 2.4,
            jmPos.z + Math.cos(orbitState.theta + 0.35) * r
          );
          camera.lookAt(jmPos.x, jmPos.y + 1.25, jmPos.z);
        }
      }

      // ------------------------------------------------------------------------
      // 15. LIGHTWEIGHT 60 FPS VFX & AMBIENCE UPDATE LOOP
      // ------------------------------------------------------------------------
      function updateVisualEffects(dt, elapsed) {
        for (let i = activeShockwaves.length - 1; i >= 0; i--) {
          const sw = activeShockwaves[i];
          sw.age += dt;
          if (sw.age >= sw.maxAge) {
            activeShockwaves.splice(i, 1);
          } else {
            sw.radius = lerp(0.5, sw.maxRadius, sw.age / sw.maxAge);
          }
        }
        shockwaveRingPool.forEach((ring, idx) => {
          if (idx < activeShockwaves.length) {
            const sw = activeShockwaves[idx];
            ring.visible = true;
            ring.position.set(sw.x, getTerrainHeight(sw.x, sw.z) + 0.14, sw.z);
            ring.scale.setScalar(sw.radius);
            ring.material.color.setHex(sw.colorHex);
            ring.material.opacity = (1.0 - sw.age / sw.maxAge) * 0.72;
          } else {
            ring.visible = false;
          }
        });

        slashArcPool.forEach((s) => {
          if (s.life > 0) {
            s.life -= dt;
            const ratio = Math.max(0, s.life / s.maxLife);
            s.mesh.material.opacity = ratio * 0.9;
            s.mesh.scale.multiplyScalar(1.0 + dt * 1.4);
            if (s.life <= 0) s.mesh.visible = false;
          }
        });

        hitSparkPool.forEach((sp) => {
          if (sp.life > 0) {
            sp.life -= dt;
            sp.mesh.position.x += sp.vx * dt;
            sp.mesh.position.y += sp.vy * dt;
            sp.mesh.position.z += sp.vz * dt;
            sp.vy -= 18.0 * dt;
            sp.mesh.material.opacity = Math.max(0, sp.life / sp.maxLife);
            if (sp.life <= 0) sp.mesh.visible = false;
          }
        });

        ghostPool.forEach((g) => {
          if (g.life > 0) {
            g.life -= dt;
            g.mesh.material.opacity = Math.max(0, (g.life / 0.28) * 0.5);
            if (g.life <= 0) g.mesh.visible = false;
          }
        });

        // Gentle wind sway on perimeter trees (22 meshes = zero CPU cost)
        swayingTrees.forEach((tr) => {
          tr.crown.rotation.z = Math.sin(elapsed * 1.4 + tr.phase) * 0.045;
          tr.crown.rotation.x = Math.cos(elapsed * 1.1 + tr.phase) * 0.035;
        });

        cloudsGroup.children.forEach((cl) => {
          cl.userData.angle += cl.userData.speed * dt;
          cl.position.x = Math.cos(cl.userData.angle) * cl.userData.radius;
          cl.position.z = Math.sin(cl.userData.angle) * cl.userData.radius;
        });

        const pArr = pollenGeo.attributes.position.array;
        for (let i = 0; i < POLLEN_COUNT; i++) {
          pArr[i * 3] += (0.45 + Math.sin(elapsed + i) * 0.2) * dt;
          pArr[i * 3 + 1] += Math.sin(elapsed * 1.5 + i * 0.7) * 0.18 * dt;
          if (pArr[i * 3] > 26) pArr[i * 3] = -26;
        }
        pollenGeo.attributes.position.needsUpdate = true;

        streamMat.emissiveIntensity = 0.22 + Math.sin(elapsed * 3.0) * 0.08;

        fireworks.forEach((fw) => {
          const age = simTime - fw.triggerTime;
          if (simTime >= 110.0 && age >= 0 && age < 2.4) {
            fw.points.material.opacity = 1.0 - age / 2.4;
            const arr = fw.points.geometry.attributes.position.array;
            for (let p = 0; p < fw.dirs.length; p++) {
              const d = fw.dirs[p];
              arr[p * 3] = fw.origin.x + d.x * age * 4.8;
              arr[p * 3 + 1] = fw.origin.y + d.y * age * 4.8 - 1.2 * age * age;
              arr[p * 3 + 2] = fw.origin.z + d.z * age * 4.8;
            }
            fw.points.geometry.attributes.position.needsUpdate = true;
          } else {
            fw.points.material.opacity = 0;
          }
        });
      }

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      let lastFrameTime = performance.now();
      let totalElapsed = 0;

      updateSimulation(0.016, true);

      function animate(now) {
        requestAnimationFrame(animate);
        const rawDt = Math.min((now - lastFrameTime) / 1000, 0.05);
        lastFrameTime = now;
        totalElapsed += rawDt;

        const mangaEl = document.getElementById('manga-flash');
        if (mangaFlashTimer > 0) {
          mangaFlashTimer -= rawDt;
          mangaEl.style.opacity = '1';
        } else {
          mangaEl.style.opacity = '0';
        }

        let effectiveDt = rawDt * playbackSpeed;
        if (hitStopTimer > 0) {
          hitStopTimer -= rawDt;
          effectiveDt = 0;
        }

        if (isPlaying) {
          simTime += effectiveDt;
          if (simTime >= TOTAL_DURATION) {
            simTime = TOTAL_DURATION;
            setPlayingState(false);
          }
          updateSimulation(effectiveDt > 0 ? effectiveDt : 0.001, false);
        } else {
          updateSimulation(rawDt, true);
        }

        updateVisualEffects(rawDt, totalElapsed);
        renderer.render(scene, camera);
      }

      requestAnimationFrame(animate);
    };
  </script>
</body>
</html>
