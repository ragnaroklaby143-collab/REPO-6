<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SQUAD CLASH 3D — Golden Meadow Edition (120s Director's Cut)</title>
  <!-- Tailwind CSS for responsive glassmorphism HUD and modals -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js r128 via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Google Fonts: Inter & Rajdhani for sleek anime HUD typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b1120;
      font-family: 'Inter', sans-serif;
      color: #f8fafc;
    }
    .font-display {
      font-family: 'Rajdhani', sans-serif;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Lightweight high-contrast manga impact flash (zero backdrop-filter lag) */
    #manga-flash {
      position: fixed;
      inset: 0;
      z-index: 15;
      pointer-events: none;
      opacity: 0;
      background: #ffffff;
      mix-blend-mode: difference;
      transition: opacity 0.03s linear;
    }

    /* Subtle cinematic letterbox vignette */
    #cinematic-vignette {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background: radial-gradient(circle at 50% 48%, rgba(0,0,0,0) 58%, rgba(8, 12, 24, 0.42) 100%);
    }

    /* Glassmorphism panels */
    .glass-panel {
      background: rgba(12, 18, 32, 0.68);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.38);
    }

    /* Custom range slider for 120s timeline scrubber */
    input[type="range"].timeline-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      outline: none;
      cursor: pointer;
    }
    input[type="range"].timeline-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #facc15;
      border: 2px solid #ffffff;
      box-shadow: 0 0 12px rgba(250, 204, 21, 0.95);
      cursor: pointer;
      transition: transform 0.12s ease;
    }
    input[type="range"].timeline-slider::-webkit-slider-thumb:hover {
      transform: scale(1.22);
    }

    /* Champion Banner animation */
    @keyframes championPulse {
      0%, 100% { transform: translate(-50%, 0) scale(1); filter: drop-shadow(0 0 18px rgba(250, 204, 21, 0.75)); }
      50% { transform: translate(-50%, -3px) scale(1.03); filter: drop-shadow(0 0 32px rgba(250, 204, 21, 1)); }
    }
    .champion-banner-anim {
      animation: championPulse 2.2s ease-in-out infinite;
    }

    /* Impact Callout pop animation */
    @keyframes calloutPop {
      0% { transform: translate(-50%, -50%) scale(0.4) rotate(-6deg); opacity: 0; }
      22% { transform: translate(-50%, -50%) scale(1.18) rotate(2deg); opacity: 1; }
      76% { transform: translate(-50%, -50%) scale(1.0) rotate(0deg); opacity: 1; }
      100% { transform: translate(-50%, -62%) scale(0.92); opacity: 0; }
    }
    .callout-active {
      animation: calloutPop 0.95s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Custom scrollbar for code modal */
    pre::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    pre::-webkit-scrollbar-thumb {
      background: rgba(250, 204, 21, 0.4);
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <!-- 3D Viewport Container -->
  <div id="canvas-container"></div>

  <!-- Cinematic Vignette & Manga Impact Flash Overlay -->
  <div id="cinematic-vignette"></div>
  <div id="manga-flash"></div>

  <!-- Dynamic Center-Screen Impact Callout -->
  <div id="impact-callout" class="fixed top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 z-20 pointer-events-none hidden">
    <div id="impact-callout-text" class="font-display font-extrabold italic tracking-wider text-3xl sm:text-6xl px-5 sm:px-7 py-2 rounded-2xl border-2 border-white/80 shadow-2xl text-white uppercase whitespace-nowrap">
      CLASH!
    </div>
  </div>

  <!-- Act 8 Champion Victory Banner -->
  <div id="champion-banner" class="fixed top-24 sm:top-28 left-1/2 -translate-x-1/2 z-20 pointer-events-none hidden champion-banner-anim">
    <div class="px-6 sm:px-10 py-2.5 sm:py-3 rounded-2xl bg-gradient-to-r from-amber-600/90 via-yellow-500/95 to-amber-600/90 border-2 border-yellow-200 shadow-2xl text-center">
      <div class="text-[10px] sm:text-xs font-bold tracking-[0.35em] text-amber-950 uppercase">Golden Meadow Battle Royale</div>
      <div class="font-display font-extrabold text-2xl sm:text-4xl tracking-wider text-slate-950 drop-shadow-sm">
        👑 CHAMPION: JM 👑
      </div>
    </div>
  </div>

  <!-- TOP HUD: Fighter Status Cards & Act Indicator -->
  <header class="fixed top-0 left-0 right-0 z-20 p-2 sm:p-3.5 pointer-events-none flex flex-col gap-2">
    <!-- Fighter Cards Row -->
    <div id="fighter-hud-row" class="max-w-6xl mx-auto w-full grid grid-cols-5 gap-1.5 sm:gap-2.5 pointer-events-auto">
      <!-- Populated dynamically by JS for MARJOHN, PRIME, DAMEN, KHEN, JM -->
    </div>

    <!-- Act Badge & Timer Pill -->
    <div class="max-w-6xl mx-auto w-full flex items-center justify-between px-1">
      <div class="glass-panel px-3 py-1 rounded-full flex items-center gap-2">
        <span id="act-dot" class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>
        <span id="act-badge-text" class="font-display font-bold text-xs sm:text-sm tracking-wider text-amber-200 uppercase">
          ACT 1 • CHARACTER INTRODUCTIONS
        </span>
      </div>

      <div class="glass-panel px-3 py-1 rounded-full flex items-center gap-2 text-xs font-semibold text-slate-200">
        <span id="time-display" class="font-mono text-amber-300">000.0s</span>
        <span class="text-slate-400">/</span>
        <span class="font-mono text-slate-300">120.0s</span>
      </div>
    </div>
  </header>

  <!-- BOTTOM GLASSMORPHISM CONTROL DOCK -->
  <footer class="fixed bottom-0 left-0 right-0 z-20 p-2 sm:p-3.5 pointer-events-none">
    <div class="max-w-5xl mx-auto glass-panel rounded-2xl p-2.5 sm:p-3.5 pointer-events-auto flex flex-col gap-2.5">
      <!-- Timeline Scrubber with 8 Act Markers (0 to 120s) -->
      <div class="relative w-full pt-1 pb-2">
        <input id="timeline-scrubber" type="range" min="0" max="120" step="0.02" value="0" class="timeline-slider" aria-label="120 second battle timeline scrubber" />
        <div id="act-markers" class="relative w-full h-3 mt-1 text-[9px] sm:text-[10px] font-semibold text-slate-300">
          <!-- Populated dynamically with clickable Act markers -->
        </div>
      </div>

      <!-- Controls Bar -->
      <div class="flex flex-wrap items-center justify-between gap-2">
        <!-- Left: Play/Pause & Replay -->
        <div class="flex items-center gap-1.5 sm:gap-2">
          <button id="btn-play-pause" class="px-3.5 py-2 rounded-xl bg-amber-400 hover:bg-amber-300 active:scale-95 text-slate-950 font-bold text-xs sm:text-sm flex items-center gap-1.5 shadow-lg transition cursor-pointer">
            <span id="play-pause-icon">❚❚</span>
            <span id="play-pause-label">Pause</span>
          </button>
          <button id="btn-replay" class="px-3 py-2 rounded-xl bg-white/10 hover:bg-white/20 active:scale-95 text-white font-semibold text-xs sm:text-sm flex items-center gap-1 transition cursor-pointer" title="Replay from 0.0s">
            <span>↺</span>
            <span class="hidden sm:inline">Replay</span>
          </button>
        </div>

        <!-- Center: Speed Toggles -->
        <div class="flex items-center gap-1 bg-slate-950/50 p-1 rounded-xl border border-white/10">
          <span class="text-[10px] uppercase tracking-wider text-slate-400 px-1.5 hidden md:inline">Speed</span>
          <button data-speed="0.5" class="speed-btn px-2 py-1 rounded-lg text-xs font-bold text-slate-300 hover:text-white transition cursor-pointer">0.5x</button>
          <button data-speed="1" class="speed-btn px-2 py-1 rounded-lg text-xs font-bold text-slate-300 hover:text-white transition cursor-pointer">1x</button>
          <button data-speed="1.35" class="speed-btn px-2 py-1 rounded-lg text-xs font-bold bg-amber-400 text-slate-950 transition cursor-pointer">1.35x (Action)</button>
          <button data-speed="2" class="speed-btn px-2 py-1 rounded-lg text-xs font-bold text-slate-300 hover:text-white transition cursor-pointer">2x</button>
        </div>

        <!-- Right: Camera Mode, Audio Toggle, Node.js Export -->
        <div class="flex items-center gap-1.5 sm:gap-2">
          <div class="flex items-center bg-slate-950/50 p-1 rounded-xl border border-white/10">
            <button data-cam="auto" class="cam-btn px-2 sm:px-2.5 py-1 rounded-lg text-xs font-bold bg-sky-400 text-slate-950 transition cursor-pointer">Auto Director</button>
            <button data-cam="orbit" class="cam-btn px-2 sm:px-2.5 py-1 rounded-lg text-xs font-bold text-slate-300 hover:text-white transition cursor-pointer">Free Orbit</button>
            <button data-cam="jm" class="cam-btn px-2 sm:px-2.5 py-1 rounded-lg text-xs font-bold text-slate-300 hover:text-white transition cursor-pointer">Track JM</button>
          </div>

          <button id="btn-audio" class="px-2.5 sm:px-3 py-2 rounded-xl bg-white/10 hover:bg-white/20 active:scale-95 text-xs font-bold text-slate-200 flex items-center gap-1.5 border border-white/10 transition cursor-pointer" title="Toggle Web Audio SFX & Wind">
            <span id="audio-icon">🔇</span>
            <span class="hidden md:inline" id="audio-label">Audio Off</span>
          </button>

          <button id="btn-node-modal" class="px-2.5 sm:px-3 py-2 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/35 border border-emerald-400/40 active:scale-95 text-emerald-200 text-xs font-bold flex items-center gap-1.5 transition cursor-pointer">
            <span>&lt;/&gt;</span>
            <span class="hidden sm:inline">Node.js Code</span>
          </button>
        </div>
      </div>
    </div>
  </footer>

  <!-- Toast Notification (Replaces alert) -->
  <div id="toast-box" class="fixed bottom-28 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-xl bg-emerald-500 text-slate-950 font-bold text-xs sm:text-sm shadow-2xl opacity-0 pointer-events-none transition-opacity duration-200">
    Copied to clipboard!
  </div>

  <!-- Node.js Server Export Modal -->
  <div id="node-modal" class="fixed inset-0 z-40 bg-slate-950/75 backdrop-blur-md hidden items-center justify-center p-3 sm:p-6">
    <div class="glass-panel rounded-2xl max-w-2xl w-full p-4 sm:p-6 border border-white/20 flex flex-col gap-4 max-h-[88vh]">
      <div class="flex items-center justify-between border-b border-white/10 pb-3">
        <div>
          <h2 class="font-display font-bold text-xl sm:text-2xl text-amber-300">Zero-Dependency Node.js Server</h2>
          <p class="text-xs text-slate-300">Save as <code class="text-emerald-300">squad-clash-server.js</code> alongside <code class="text-emerald-300">index.html</code> and run <code class="text-amber-200">node squad-clash-server.js</code></p>
        </div>
        <button id="btn-close-modal" class="w-9 h-9 rounded-xl bg-white/10 hover:bg-white/20 text-white font-bold flex items-center justify-center cursor-pointer">✕</button>
      </div>

      <pre id="node-code-block" class="bg-slate-950/90 border border-white/10 rounded-xl p-3.5 text-xs font-mono text-emerald-300 overflow-auto max-h-[48vh] leading-relaxed"></pre>

      <div class="flex flex-wrap items-center justify-end gap-2 pt-1">
        <button id="btn-copy-node" class="px-4 py-2 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold text-xs sm:text-sm transition cursor-pointer">
          Copy Code
        </button>
        <button id="btn-download-node" class="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs sm:text-sm transition cursor-pointer">
          Download squad-clash-server.js
        </button>
      </div>
    </div>
  </div>

  <script>
    /**
     * ============================================================================
     * SQUAD CLASH 3D — GOLDEN MEADOW EDITION (120-SECOND DIRECTOR'S CUT)
     * Single-file Three.js (r128) + Tailwind CSS anime battle royale motion graphic
     * featuring:
     * - Deterministic 120.0s (2-minute) 8-act Combat Gods-inspired choreography
     * - Full multi-joint articulated rigs (pelvis, torso twist/pitch/roll, head,
     *   shoulders, elbows, forearms, hands/weapons, thighs, knees, shins, boots)
     * - Distinct movement languages for all 5 fighters (Marjohn, Prime, Damen, Khen, JM)
     * - Substantial 3D environmental destruction across multiple terrain zones:
     *   1) Western Ruined Stone Temple (archway, columns & lintels fracture at 40.5s)
     *   2) Eastern Jagged Highland Cliff (rock outcrop slabs avalanche at 56.5s)
     *   3) Northern Reflective Stream (3D splash plumes & expanding ripples in Act 5)
     *   4) Multiple destructible boulders & persistent scorched-earth craters
     * - Locked 60 FPS performance: static 110-tuft perimeter grass, cached eye
     *   textures, reusable object pools, and deterministic scrubbing at any second.
     * ============================================================================
     */

    const TOTAL_DURATION = 120.0;

    // --------------------------------------------------------------------------
    // 1. SPRING-DAMPER PHYSICS & BIOMECHANICAL POSE HELPERS
    // --------------------------------------------------------------------------
    class Spring1D {
      constructor(initial = 0, stiffness = 220, damping = 18) {
        this.value = initial;
        this.target = initial;
        this.velocity = 0;
        this.stiffness = stiffness;
        this.damping = damping;
      }
      reset(val = 0) {
        this.value = val;
        this.target = val;
        this.velocity = 0;
      }
      impulse(dv) {
        this.velocity += dv;
      }
      update(dt) {
        const clampedDt = Math.min(dt, 0.05);
        const force = (this.target - this.value) * this.stiffness;
        const damp = this.velocity * this.damping;
        this.velocity += (force - damp) * clampedDt;
        this.value += this.velocity * clampedDt;
        return this.value;
      }
    }

    class Spring3D {
      constructor(x = 0, y = 0, z = 0, stiffness = 220, damping = 18) {
        this.x = new Spring1D(x, stiffness, damping);
        this.y = new Spring1D(y, stiffness, damping);
        this.z = new Spring1D(z, stiffness, damping);
      }
      setTarget(x, y, z) {
        this.x.target = x;
        this.y.target = y;
        this.z.target = z;
      }
      reset(x, y, z) {
        this.x.reset(x);
        this.y.reset(y);
        this.z.reset(z);
      }
      update(dt) {
        this.x.update(dt);
        this.y.update(dt);
        this.z.update(dt);
      }
    }

    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
    const lerp = (a, b, t) => a + (b - a) * clamp(t, 0, 1);
    const smoothstep = (e0, e1, x) => {
      const t = clamp((x - e0) / (e1 - e0), 0, 1);
      return t * t * (3 - 2 * t);
    };

    /**
     * Biomechanical multi-joint running/sprinting stride pose.
     */
    function getRunStridePose(phase, intensity = 1.0) {
      const s = Math.sin(phase);
      const c = Math.cos(phase);
      const thighSwing = 0.88 * intensity;
      const armSwing = 0.76 * intensity;
      return {
        hipY: Math.abs(c) * 0.09 * intensity - 0.05 * intensity,
        torsoPitch: 0.36 * intensity,
        torsoYaw: -s * 0.24 * intensity,
        thighL: [s * thighSwing, 0, -0.05],
        kneeL: Math.max(0.12, -c * 1.18 * intensity + 0.35),
        thighR: [-s * thighSwing, 0, 0.05],
        kneeR: Math.max(0.12, c * 1.18 * intensity + 0.35),
        armL: [-s * armSwing - 0.2, 0, -0.18],
        elbowL: -0.95 - Math.max(0, -s) * 0.45,
        armR: [s * armSwing - 0.2, 0, 0.18],
        elbowR: -0.95 - Math.max(0, s) * 0.45
      };
    }

    /**
     * Grounded martial arts ready stance tailored per fighter weapon/personality.
     */
    function getMartialGuardPose(time, phaseOffset = 0, style = 'fist') {
      const pulse = Math.sin(time * 5.0 + phaseOffset);
      const crouch = 0.08 + pulse * 0.025;
      const base = {
        hipY: -crouch,
        torsoPitch: 0.14,
        torsoYaw: 0.22 + pulse * 0.05,
        thighL: [-0.32 - pulse * 0.05, 0.15, -0.12],
        kneeL: 0.52 + pulse * 0.08,
        thighR: [0.24 - pulse * 0.05, -0.18, 0.14],
        kneeR: 0.46 + pulse * 0.08,
        armL: [-0.75 + pulse * 0.08, 0.25, -0.28],
        elbowL: -1.35,
        armR: [-0.55 - pulse * 0.08, -0.25, 0.28],
        elbowR: -1.25
      };
      if (style === 'staff') {
        base.armL = [-0.88, 0.48, -0.18];
        base.elbowL = -1.05;
        base.armR = [-0.42, -0.35, 0.32];
        base.elbowR = -0.92;
      } else if (style === 'heavy') {
        base.hipY = -0.14 - pulse * 0.03;
        base.torsoPitch = 0.24;
        base.thighL = [-0.42, 0.18, -0.16];
        base.kneeL = 0.72;
        base.thighR = [0.34, -0.18, 0.18];
        base.kneeR = 0.65;
        base.armL = [-0.95, 0.35, -0.35];
        base.elbowL = -1.45;
        base.armR = [-0.85, -0.35, 0.35];
        base.elbowR = -1.35;
      } else if (style === 'guns') {
        base.armL = [-0.95, 0.15, -0.32];
        base.elbowL = -1.15;
        base.armR = [-0.95, -0.15, 0.32];
        base.elbowR = -1.15;
      } else if (style === 'daggers') {
        base.armL = [-0.65, 0.32, -0.35];
        base.elbowL = -1.42;
        base.armR = [-0.65, -0.32, 0.35];
        base.elbowR = -1.42;
      }
      return base;
    }

    // --------------------------------------------------------------------------
    // 2. DETERMINISTIC MULTI-ZONE HIGHLAND TERRAIN HEIGHT FUNCTION
    // --------------------------------------------------------------------------
    function getStreamZ(x) {
      return -20.5 + 2.8 * Math.sin(x * 0.09);
    }

    function getTerrainHeight(x, z) {
      const r = Math.sqrt(x * x + z * z);
      // Central combat clearing & Western Temple terrace stay level for crisp footing
      if (r < 13.5) {
        return 0.03 * Math.sin(x * 0.45) * Math.cos(z * 0.45);
      }
      // Northern Stream channel depression along z ~ getStreamZ(x)
      const streamCenterZ = getStreamZ(x);
      const distToStream = Math.abs(z - streamCenterZ);
      const streamCarve = distToStream < 4.4 ? -0.68 * Math.cos((distToStream / 4.4) * Math.PI * 0.5) : 0;

      // Keep Western Temple plaza around (-16.5, -4.0) gently terraced
      const distToTemple = Math.hypot(x + 16.5, z + 4.0);
      const templeFlatten = 1.0 - smoothstep(4.5, 9.5, distToTemple);

      // Eastern Highland Cliff plateau rise around (+18.5, -2.5)
      const distToCliff = Math.hypot(x - 19.5, z + 2.5);
      const cliffRise = (1.0 - smoothstep(3.0, 11.5, distToCliff)) * 2.4;

      // Rolling meadow hills rising outside the central arena
      const hillFactor = smoothstep(13.5, 60.0, r) * (1.0 - templeFlatten * 0.85);
      const n1 = Math.sin(x * 0.055 + 0.4) * Math.cos(z * 0.055 - 0.3);
      const n2 = Math.sin(x * 0.12 - z * 0.09) * 0.45;
      const n3 = Math.cos(x * 0.22 + z * 0.18) * 0.18;
      const ridgeBoost = smoothstep(44.0, 105.0, r) * 14.5;

      return hillFactor * (7.0 * (n1 * 0.5 + 0.5) + n2 + n3) + ridgeBoost + streamCarve + cliffRise;
    }

    // --------------------------------------------------------------------------
    // 3. FAST 512x512 PROCEDURAL PBR CANVAS TEXTURES
    // --------------------------------------------------------------------------
    function createMeadowTextures() {
      const size = 512;
      const albedoCanvas = document.createElement('canvas');
      albedoCanvas.width = size;
      albedoCanvas.height = size;
      const aCtx = albedoCanvas.getContext('2d');

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = size;
      bumpCanvas.height = size;
      const bCtx = bumpCanvas.getContext('2d');

      const baseGrad = aCtx.createRadialGradient(size * 0.5, size * 0.5, 10, size * 0.5, size * 0.5, size * 0.5);
      baseGrad.addColorStop(0.0, '#6a7c38');
      baseGrad.addColorStop(0.11, '#58782d');
      baseGrad.addColorStop(0.32, '#437528');
      baseGrad.addColorStop(0.68, '#366622');
      baseGrad.addColorStop(1.0, '#2c541d');
      aCtx.fillStyle = baseGrad;
      aCtx.fillRect(0, 0, size, size);

      bCtx.fillStyle = '#808080';
      bCtx.fillRect(0, 0, size, size);

      let seed = 1337;
      const rand = () => {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      };

      for (let i = 0; i < 180; i++) {
        const px = rand() * size;
        const py = rand() * size;
        const rad = 8 + rand() * 26;
        const isGolden = rand() > 0.42;
        const grad = aCtx.createRadialGradient(px, py, 1, px, py, rad);
        grad.addColorStop(0, isGolden ? 'rgba(163, 178, 54, 0.28)' : 'rgba(42, 102, 34, 0.32)');
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        aCtx.fillStyle = grad;
        aCtx.beginPath();
        aCtx.arc(px, py, rad, 0, Math.PI * 2);
        aCtx.fill();
      }

      // Trampled earthen battle clearing in the center
      const cx = size * 0.5;
      const cy = size * 0.5;
      const dirtGrad = aCtx.createRadialGradient(cx, cy, 4, cx, cy, 40);
      dirtGrad.addColorStop(0, 'rgba(122, 99, 64, 0.80)');
      dirtGrad.addColorStop(0.55, 'rgba(108, 96, 56, 0.52)');
      dirtGrad.addColorStop(0.85, 'rgba(84, 104, 44, 0.22)');
      dirtGrad.addColorStop(1, 'rgba(84, 104, 44, 0)');
      aCtx.fillStyle = dirtGrad;
      aCtx.beginPath();
      aCtx.arc(cx, cy, 40, 0, Math.PI * 2);
      aCtx.fill();

      // Winding mossy cobblestone footpath connecting clearing to Western Temple & Southern Fence
      aCtx.save();
      aCtx.strokeStyle = 'rgba(136, 126, 104, 0.62)';
      aCtx.lineWidth = 6;
      aCtx.lineCap = 'round';
      aCtx.beginPath();
      aCtx.moveTo(size * 0.42, size * 0.48);
      aCtx.lineTo(size * 0.56, size * 0.58);
      aCtx.bezierCurveTo(size * 0.64, size * 0.66, size * 0.70, size * 0.76, size * 0.78, size * 0.86);
      aCtx.stroke();
      aCtx.restore();

      for (let i = 0; i < 4200; i++) {
        const x = rand() * size;
        const y = rand() * size;
        const len = 2 + rand() * 4.5;
        const angle = -Math.PI * 0.5 + (rand() - 0.5) * 0.7;
        const shade = rand();
        aCtx.strokeStyle =
          shade > 0.65
            ? 'rgba(176, 194, 68, 0.45)'
            : shade > 0.3
            ? 'rgba(78, 134, 42, 0.48)'
            : 'rgba(38, 82, 26, 0.45)';
        aCtx.lineWidth = 1.0;
        aCtx.beginPath();
        aCtx.moveTo(x, y);
        aCtx.lineTo(x + Math.cos(angle) * len, y + Math.sin(angle) * len);
        aCtx.stroke();

        const bVal = Math.floor(110 + rand() * 65);
        bCtx.strokeStyle = `rgb(${bVal},${bVal},${bVal})`;
        bCtx.beginPath();
        bCtx.moveTo(x, y);
        bCtx.lineTo(x + Math.cos(angle) * len, y + Math.sin(angle) * len);
        bCtx.stroke();
      }

      const albedo = new THREE.CanvasTexture(albedoCanvas);
      albedo.anisotropy = 4;
      const bump = new THREE.CanvasTexture(bumpCanvas);
      return { albedo, bump };
    }

    // Cached Anime Eye CanvasTexture per fighter (redraws only on state change)
    function createAnimeEyeTexture(irisColorHex) {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      let currentState = '';

      function drawState(state = 'normal') {
        if (currentState === state) return false;
        currentState = state;
        ctx.clearRect(0, 0, 128, 128);
        if (state === 'ko') {
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 12;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(26, 26);
          ctx.lineTo(102, 102);
          ctx.moveTo(102, 26);
          ctx.lineTo(26, 102);
          ctx.stroke();
          return true;
        }
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(64, 64, 48, state === 'shock' ? 54 : 44, 0, 0, Math.PI * 2);
        ctx.fill();

        const irisR = state === 'shock' ? 22 : 30;
        const grad = ctx.createRadialGradient(64, 60, 6, 64, 64, irisR);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.35, irisColorHex);
        grad.addColorStop(1, '#0f172a');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(64, 64, irisR, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#090d16';
        ctx.beginPath();
        ctx.arc(64, 64, state === 'shock' ? 9 : 13, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(52, 50, 8, 0, Math.PI * 2);
        ctx.arc(76, 74, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(10, 12, 108, state === 'fierce' ? 24 : 14);
        return true;
      }

      drawState('normal');
      const tex = new THREE.CanvasTexture(canvas);
      tex.userData = { drawState };
      return tex;
    }

    // --------------------------------------------------------------------------
    // 4. ENHANCED PROCEDURAL WEB AUDIO SYNTHESIZER (DISTINCT BATTLE CUES)
    // --------------------------------------------------------------------------
    class BattleAudioEngine {
      constructor() {
        this.enabled = false;
        this.ctx = null;
        this.windGain = null;
        this.masterGain = null;
        this.triggeredKeys = new Set();
      }

      reset() {
        this.triggeredKeys.clear();
      }

      toggle() {
        this.enabled = !this.enabled;
        if (this.enabled) {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioCtx();
            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.value = 0.34;
            this.masterGain.connect(this.ctx.destination);
            this._startMeadowWindAmbience();
          }
          if (this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
          if (this.windGain) {
            this.windGain.gain.setTargetAtTime(0.10, this.ctx.currentTime, 0.25);
          }
        } else if (this.windGain && this.ctx) {
          this.windGain.gain.setTargetAtTime(0.0, this.ctx.currentTime, 0.15);
        }
        return this.enabled;
      }

      _startMeadowWindAmbience() {
        const bufferSize = this.ctx.sampleRate * 2;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.997 * b0 + white * 0.029;
          b1 = 0.985 * b1 + white * 0.032;
          b2 = 0.950 * b2 + white * 0.048;
          data[i] = (b0 + b1 + b2 + white * 0.02) * 0.5;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 380;
        filter.Q.value = 1.4;

        this.windGain = this.ctx.createGain();
        this.windGain.gain.value = 0.10;

        noise.connect(filter);
        filter.connect(this.windGain);
        this.windGain.connect(this.masterGain);
        noise.start();
      }

      playEvent(key, type = 'whoosh') {
        if (!this.enabled || !this.ctx || this.triggeredKeys.has(key)) return;
        this.triggeredKeys.add(key);
        const now = this.ctx.currentTime;

        if (type === 'whoosh' || type === 'wind') {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type === 'wind' ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(type === 'wind' ? 660 : 520, now);
          osc.frequency.exponentialRampToValueAtTime(110, now + 0.22);
          gain.gain.setValueAtTime(0.24, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'charge') {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.exponentialRampToValueAtTime(640, now + 0.85);
          gain.gain.setValueAtTime(0.02, now);
          gain.gain.linearRampToValueAtTime(0.26, now + 0.65);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(now);
          osc.stop(now + 0.92);
        } else if (type === 'splash') {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(420, now);
          osc.frequency.exponentialRampToValueAtTime(180, now + 0.26);
          gain.gain.setValueAtTime(0.28, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'shatter' || type === 'rockslide') {
          // Multi-layered low rumble + crisp architectural stone cracks
          for (let k = 0; k < 4; k++) {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = k % 2 === 0 ? 'sawtooth' : 'square';
            const st = now + k * 0.06;
            osc.frequency.setValueAtTime(190 - k * 25, st);
            osc.frequency.exponentialRampToValueAtTime(32, st + 0.45);
            gain.gain.setValueAtTime(0.36, st);
            gain.gain.exponentialRampToValueAtTime(0.001, st + 0.48);
            osc.connect(gain);
            gain.connect(this.masterGain);
            osc.start(st);
            osc.stop(st + 0.5);
          }
        } else if (type === 'clash' || type === 'ko') {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(type === 'ko' ? 165 : 130, now);
          osc.frequency.exponentialRampToValueAtTime(34, now + 0.52);
          gain.gain.setValueAtTime(0.55, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.54);
          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(now);
          osc.stop(now + 0.56);

          const clang = this.ctx.createOscillator();
          const cGain = this.ctx.createGain();
          clang.type = 'square';
          clang.frequency.setValueAtTime(880, now);
          clang.frequency.exponentialRampToValueAtTime(220, now + 0.26);
          cGain.gain.setValueAtTime(0.22, now);
          cGain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          clang.connect(cGain);
          cGain.connect(this.masterGain);
          clang.start(now);
          clang.stop(now + 0.3);
        } else if (type === 'gunshot') {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(720, now);
          osc.frequency.exponentialRampToValueAtTime(65, now + 0.14);
          gain.gain.setValueAtTime(0.30, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(now);
          osc.stop(now + 0.16);
        } else if (type === 'beam') {
          [220, 330, 440, 660].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = idx % 2 === 0 ? 'sawtooth' : 'sine';
            osc.frequency.setValueAtTime(freq * 0.85, now);
            osc.frequency.linearRampToValueAtTime(freq * 1.18, now + 1.4);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 1.65);
            osc.connect(gain);
            gain.connect(this.masterGain);
            osc.start(now);
            osc.stop(now + 1.7);
          });
        } else if (type === 'victory') {
          [261.63, 329.63, 392.0, 523.25, 659.25].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.07);
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.17, now + idx * 0.07 + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);
            osc.connect(gain);
            gain.connect(this.masterGain);
            osc.start(now + idx * 0.07);
            osc.stop(now + 2.6);
          });
        }
      }
    }

    // --------------------------------------------------------------------------
    // 5. MAIN APPLICATION & 60 FPS RENDERER SETUP
    // --------------------------------------------------------------------------
    window.onload = function () {
      const container = document.getElementById('canvas-container');
      const audioEngine = new BattleAudioEngine();

      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.12;
      container.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const fog = new THREE.FogExp2(0xfde68a, 0.0056);
      scene.fog = fog;

      const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 400);
      camera.position.set(0, 6.5, 19);

      // ------------------------------------------------------------------------
      // 6. ATMOSPHERIC GLSL SKY DOME, GOD-RAYS, CLOUDS & MULTI-TIERED MOUNTAINS
      // ------------------------------------------------------------------------
      const skyUniforms = {
        uZenithColor: { value: new THREE.Color('#1d4ed8') },
        uMidSkyColor: { value: new THREE.Color('#f59e0b') },
        uHorizonColor: { value: new THREE.Color('#fef08a') },
        uSunDir: { value: new THREE.Vector3(-0.45, 0.28, -0.84).normalize() },
        uStormFactor: { value: 0.0 },
        uTime: { value: 0.0 }
      };

      const skyMat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: skyUniforms,
        vertexShader: `
          varying vec3 vWorldPos;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPos = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          uniform vec3 uZenithColor;
          uniform vec3 uMidSkyColor;
          uniform vec3 uHorizonColor;
          uniform vec3 uSunDir;
          uniform float uStormFactor;
          uniform float uTime;
          varying vec3 vWorldPos;

          void main() {
            vec3 dir = normalize(vWorldPos);
            float h = clamp(dir.y, 0.0, 1.0);

            vec3 zenith = mix(uZenithColor, vec3(0.08, 0.06, 0.20), uStormFactor);
            vec3 mid = mix(uMidSkyColor, vec3(0.24, 0.11, 0.44), uStormFactor);
            vec3 horizon = mix(uHorizonColor, vec3(0.48, 0.20, 0.65), uStormFactor);

            vec3 col = mix(horizon, mid, smoothstep(0.0, 0.24, h));
            col = mix(col, zenith, smoothstep(0.24, 0.82, h));

            float sunDot = max(dot(dir, normalize(uSunDir)), 0.0);
            float sunHalo = pow(sunDot, 12.0) * 0.45 + pow(sunDot, 160.0) * 1.4;
            vec3 sunTint = mix(vec3(1.0, 0.92, 0.65), vec3(0.75, 0.45, 1.0), uStormFactor * 0.75);
            col += sunTint * sunHalo * (1.0 - uStormFactor * 0.55);

            float wisp = sin(dir.x * 14.0 + uTime * 0.12 + dir.z * 9.0) * cos(dir.z * 12.0 - uTime * 0.08);
            col += sunTint * max(0.0, wisp) * 0.05 * smoothstep(0.1, 0.6, h);

            gl_FragColor = vec4(col, 1.0);
          }
        `
      });
      scene.add(new THREE.Mesh(new THREE.SphereGeometry(210, 36, 24), skyMat));

      const sunDisc = new THREE.Mesh(
        new THREE.CircleGeometry(14, 28),
        new THREE.MeshBasicMaterial({ color: 0xfffbeb, transparent: true, opacity: 0.92, fog: false })
      );
      sunDisc.position.set(-85, 52, -158);
      sunDisc.lookAt(0, 0, 0);
      scene.add(sunDisc);

      const godRaysGroup = new THREE.Group();
      scene.add(godRaysGroup);
      const godRayMeshes = [];
      for (let i = 0; i < 6; i++) {
        const rayGeo = new THREE.CylinderGeometry(1.5, 11.5, 145, 12, 1, true);
        const rayMat = new THREE.MeshBasicMaterial({
          color: 0xfef08a,
          transparent: true,
          opacity: 0.065,
          blending: THREE.AdditiveBlending,
          side: THREE.DoubleSide,
          depthWrite: false
        });
        const ray = new THREE.Mesh(rayGeo, rayMat);
        ray.position.set(-45 + i * 18, 36, -85 + (i % 3) * 18);
        ray.rotation.z = -0.44;
        ray.rotation.x = 0.25;
        godRaysGroup.add(ray);
        godRayMeshes.push(ray);
      }

      const cloudsGroup = new THREE.Group();
      scene.add(cloudsGroup);
      const cloudMaterials = [];
      for (let c = 0; c < 10; c++) {
        const cloudCluster = new THREE.Group();
        const cMat = new THREE.MeshStandardMaterial({
          color: 0xfff7ed,
          emissive: 0xfbbf24,
          emissiveIntensity: 0.16,
          roughness: 0.95
        });
        cloudMaterials.push(cMat);
        const puffs = 3 + (c % 3);
        for (let p = 0; p < puffs; p++) {
          const puff = new THREE.Mesh(new THREE.SphereGeometry(3.2 + (p % 3) * 1.4, 10, 8), cMat);
          puff.position.set((p - puffs * 0.5) * 3.4, Math.sin(p * 1.4) * 1.1, (p % 2) * 1.8);
          puff.scale.set(1.4, 0.65, 1.0);
          cloudCluster.add(puff);
        }
        const angle = (c / 10) * Math.PI * 2;
        const radius = 62 + (c % 3) * 26;
        cloudCluster.position.set(Math.cos(angle) * radius, 34 + (c % 4) * 5, Math.sin(angle) * radius);
        cloudCluster.userData = { angle, radius, speed: 0.008 + (c % 3) * 0.003 };
        cloudsGroup.add(cloudCluster);
      }

      function buildMountainRing(radius, baseHeight, peakHeight, segments, colorHex, snowCaps = false) {
        const geo = new THREE.CylinderGeometry(radius, radius + 24, baseHeight, segments, 4, true);
        const pos = geo.attributes.position;
        const colors = new Float32Array(pos.count * 3);
        const baseCol = new THREE.Color(colorHex);
        const peakCol = snowCaps ? new THREE.Color('#f8fafc') : new THREE.Color(colorHex).offsetHSL(0.02, -0.05, 0.12);

        for (let i = 0; i < pos.count; i++) {
          const vx = pos.getX(i);
          const vy = pos.getY(i);
          const vz = pos.getZ(i);
          const ang = Math.atan2(vz, vx);
          const normY = (vy + baseHeight * 0.5) / baseHeight;

          if (normY > 0.1) {
            const ridge =
              Math.abs(Math.sin(ang * 7.0 + radius * 0.1)) * 0.55 +
              Math.abs(Math.cos(ang * 15.0 - 0.8)) * 0.30 +
              Math.sin(ang * 29.0) * 0.15;
            pos.setY(i, vy + normY * ridge * peakHeight);
          }
          const tCol = smoothstep(0.55, 0.95, normY);
          const c = baseCol.clone().lerp(peakCol, tCol);
          colors[i * 3] = c.r;
          colors[i * 3 + 1] = c.g;
          colors[i * 3 + 2] = c.b;
        }
        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geo.computeVertexNormals();
        const mat = new THREE.MeshStandardMaterial({
          vertexColors: true,
          roughness: 0.9,
          side: THREE.DoubleSide
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.y = baseHeight * 0.36;
        scene.add(mesh);
        return mesh;
      }

      buildMountainRing(88, 22, 16, 72, '#365314', false);
      buildMountainRing(118, 34, 26, 84, '#3f6212', false);
      buildMountainRing(152, 48, 38, 96, '#475569', true);

      // ------------------------------------------------------------------------
      // 7. LIGHTING (GOLDEN SUNLIGHT SHADOWS, HEMISPHERE FILL, DYNAMIC FX LIGHTS)
      // ------------------------------------------------------------------------
      const hemiLight = new THREE.HemisphereLight(0x93c5fd, 0x3f6212, 0.82);
      scene.add(hemiLight);

      const sunLight = new THREE.DirectionalLight(0xffedd5, 1.85);
      sunLight.position.set(-28, 34, -36);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.width = 1024;
      sunLight.shadow.mapSize.height = 1024;
      sunLight.shadow.camera.near = 2;
      sunLight.shadow.camera.far = 115;
      const shadowBound = 28;
      sunLight.shadow.camera.left = -shadowBound;
      sunLight.shadow.camera.right = shadowBound;
      sunLight.shadow.camera.top = shadowBound;
      sunLight.shadow.camera.bottom = -shadowBound;
      sunLight.shadow.bias = -0.0006;
      scene.add(sunLight);

      const rimLight = new THREE.DirectionalLight(0xfde68a, 0.55);
      rimLight.position.set(24, 14, 28);
      scene.add(rimLight);

      const actionPointLight = new THREE.PointLight(0xfacc15, 0, 26);
      actionPointLight.position.set(0, 3, 0);
      scene.add(actionPointLight);

      // ------------------------------------------------------------------------
      // 8. SCULPTED TERRAIN, STREAM, DESTRUCTIBLE TEMPLE RUINS & CLIFF OUTCROP
      // ------------------------------------------------------------------------
      const meadowTextures = createMeadowTextures();
      const { stoneTex, barkTex, plaidTex, idTex } = createStoneAndBarkTextures();

      const terrainGeo = new THREE.PlaneGeometry(220, 220, 104, 104);
      terrainGeo.rotateX(-Math.PI / 2);
      const tPos = terrainGeo.attributes.position;
      for (let i = 0; i < tPos.count; i++) {
        const vx = tPos.getX(i);
        const vz = tPos.getZ(i);
        tPos.setY(i, getTerrainHeight(vx, vz));
      }
      terrainGeo.computeVertexNormals();

      const terrainMat = new THREE.MeshStandardMaterial({
        map: meadowTextures.albedo,
        bumpMap: meadowTextures.bump,
        bumpScale: 0.12,
        roughness: 0.88,
        metalness: 0.02
      });
      const terrainMesh = new THREE.Mesh(terrainGeo, terrainMat);
      terrainMesh.receiveShadow = true;
      scene.add(terrainMesh);

      // Northern Reflective Stream along z ~ -20.5
      const streamGeo = new THREE.PlaneGeometry(130, 5.2, 48, 2);
      streamGeo.rotateX(-Math.PI / 2);
      const sPos = streamGeo.attributes.position;
      for (let i = 0; i < sPos.count; i++) {
        const sx = sPos.getX(i);
        const sz = sPos.getZ(i);
        const curveZ = getStreamZ(sx);
        sPos.setZ(i, sz + curveZ);
        sPos.setY(i, getTerrainHeight(sx, sz + curveZ) + 0.18);
      }
      streamGeo.computeVertexNormals();
      const streamMat = new THREE.MeshStandardMaterial({
        color: 0x38bdf8,
        emissive: 0x0284c7,
        emissiveIntensity: 0.25,
        roughness: 0.12,
        metalness: 0.78,
        transparent: true,
        opacity: 0.85
      });
      scene.add(new THREE.Mesh(streamGeo, streamMat));

      // Wind-Swaying Perimeter Grove of Trees (22 trees)
      const swayingTrees = [];
      const barkMat = new THREE.MeshStandardMaterial({ map: barkTex, roughness: 0.92 });
      const canopyMats = [
        new THREE.MeshStandardMaterial({ color: 0x4d7c0f, roughness: 0.85 }),
        new THREE.MeshStandardMaterial({ color: 0x65a30d, roughness: 0.85 }),
        new THREE.MeshStandardMaterial({ color: 0xa16207, roughness: 0.85 })
      ];

      for (let t = 0; t < 22; t++) {
        const ang = (t / 22) * Math.PI * 2 + 0.14;
        const dist = 27 + (t % 4) * 9.5;
        const tx = Math.cos(ang) * dist;
        const tz = Math.sin(ang) * dist;
        if (Math.abs(tz - getStreamZ(tx)) < 4.5) continue;

        const ty = getTerrainHeight(tx, tz);
        const treeGroup = new THREE.Group();
        treeGroup.position.set(tx, ty, tz);

        const scale = 0.85 + (t % 3) * 0.28;
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.24 * scale, 0.44 * scale, 4.2 * scale, 7), barkMat);
        trunk.position.y = 2.1 * scale;
        trunk.castShadow = true;
        treeGroup.add(trunk);

        const crown = new THREE.Mesh(new THREE.DodecahedronGeometry(2.1 * scale, 1), canopyMats[t % canopyMats.length]);
        crown.position.y = 4.6 * scale;
        crown.scale.set(1.15, 0.85, 1.15);
        treeGroup.add(crown);

        scene.add(treeGroup);
        swayingTrees.push({ group: treeGroup, crown, phase: t * 0.9 });
      }

      // Wooden Pasture Fence Segments along the southern meadow edge (Damen vaults over this in Act 1!)
      for (let f = -4; f <= 4; f++) {
        const fx = f * 3.4;
        const fz = 14.5 + Math.sin(f * 0.5) * 0.8;
        const fy = getTerrainHeight(fx, fz);
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.13, 1.35, 6), barkMat);
        post.position.set(fx, fy + 0.65, fz);
        post.castShadow = true;
        scene.add(post);
        if (f < 4) {
          const rail = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.09, 0.08), barkMat);
          rail.position.set(fx + 1.7, fy + 0.95, fz);
          rail.castShadow = true;
          scene.add(rail);
          const railLow = rail.clone();
          railLow.position.y = fy + 0.52;
          scene.add(railLow);
        }
      }

      // ------------------------------------------------------------------------
      // 8A. DESTRUCTIBLE WESTERN RUINED STONE TEMPLE (SHATTERS AT t = 40.5s)
      // ------------------------------------------------------------------------
      const stoneMat = new THREE.MeshStandardMaterial({ map: stoneTex, roughness: 0.88 });
      const templeBlocks = [];
      const templeOrigin = new THREE.Vector3(-16.2, getTerrainHeight(-16.2, -3.5), -3.5);

      function addTempleBlock(dx, dy, dz, w, h, d, isDestructible, vx, vy, vz, rx, rz) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), stoneMat);
        const ox = templeOrigin.x + dx;
        const oy = templeOrigin.y + dy;
        const oz = templeOrigin.z + dz;
        mesh.position.set(ox, oy, oz);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
        templeBlocks.push({
          mesh,
          origin: new THREE.Vector3(ox, oy, oz),
          halfH: h * 0.5,
          isDestructible,
          vx,
          vy,
          vz,
          rx,
          rz
        });
      }

      // Stepped stone foundation platform (persistent base)
      addTempleBlock(0, 0.25, 0, 5.2, 0.5, 6.8, false, 0, 0, 0, 0, 0);
      // Left & Right Stone Columns (Upper & Mid drums break away!)
      addTempleBlock(0.6, 1.3, -1.8, 1.05, 1.6, 1.05, false, 0, 0, 0, 0, 0);
      addTempleBlock(0.6, 2.9, -1.8, 1.0, 1.6, 1.0, true, -6.2, 4.5, -3.4, 2.4, -3.1);
      addTempleBlock(0.6, 1.3, 1.8, 1.05, 1.6, 1.05, false, 0, 0, 0, 0, 0);
      addTempleBlock(0.6, 2.9, 1.8, 1.0, 1.6, 1.0, true, -5.8, 5.2, 3.6, -2.8, 3.4);
      // Heavy Stone Archway Lintel & Pediment Crown (shatters into 4 huge slabs!)
      addTempleBlock(0.6, 4.15, -1.1, 1.25, 0.85, 2.3, true, -7.8, 6.5, -2.2, 3.5, -2.6);
      addTempleBlock(0.6, 4.15,  1.1, 1.25, 0.85, 2.3, true, -8.4, 6.0,  2.5, -3.2, 2.9);
      addTempleBlock(0.6, 4.95,  0.0, 1.15, 0.75, 3.2, true, -9.5, 7.8,  0.4, 4.1, -3.8);
      // Back Sanctuary Wall Pillars
      addTempleBlock(-1.6, 1.9, -2.2, 0.95, 2.8, 0.95, false, 0, 0, 0, 0, 0);
      addTempleBlock(-1.6, 1.6,  2.2, 0.95, 2.2, 0.95, false, 0, 0, 0, 0, 0);

      // ------------------------------------------------------------------------
      // 8B. DESTRUCTIBLE EASTERN HIGHLAND CLIFF & ROCK OUTCROP (SHATTERS AT t = 56.5s)
      // ------------------------------------------------------------------------
      const cliffSlabs = [];
      const cliffOrigin = new THREE.Vector3(18.5, getTerrainHeight(18.5, -2.0), -2.0);
      const cliffMat = new THREE.MeshStandardMaterial({ map: stoneTex, color: 0x9ca3af, roughness: 0.92 });

      // Solid Cliff Base Buttresses
      [
        [1.8, 2.2, -2.4, 3.2, 4.4, 3.4],
        [2.2, 3.0,  1.8, 3.6, 6.0, 3.8],
        [3.4, 4.2, -0.3, 3.0, 8.4, 5.5]
      ].forEach(([dx, dy, dz, w, h, d]) => {
        const baseMesh = new THREE.Mesh(new THREE.DodecahedronGeometry(Math.max(w, d) * 0.55, 1), cliffMat);
        baseMesh.scale.set(w / 3.2, h / 3.2, d / 3.2);
        baseMesh.position.set(cliffOrigin.x + dx, cliffOrigin.y + dy * 0.7, cliffOrigin.z + dz);
        baseMesh.castShadow = true;
        baseMesh.receiveShadow = true;
        scene.add(baseMesh);
      });

      // 14 Fracturing Cliff Face Slabs that avalanche when Prime is slammed into the cliff!
      for (let c = 0; c < 14; c++) {
        const rad = 0.75 + (c % 4) * 0.28;
        const slab = new THREE.Mesh(new THREE.DodecahedronGeometry(rad, 0), cliffMat);
        const ox = cliffOrigin.x + 0.4 + (c % 3) * 0.65;
        const oy = cliffOrigin.y + 1.1 + (c % 5) * 0.95;
        const oz = cliffOrigin.z - 2.2 + (c / 14) * 4.4;
        slab.position.set(ox, oy, oz);
        slab.castShadow = true;
        slab.receiveShadow = true;
        scene.add(slab);
        const ang = ((c / 14) - 0.5) * Math.PI * 0.85;
        cliffSlabs.push({
          mesh: slab,
          origin: new THREE.Vector3(ox, oy, oz),
          rad,
          vx: -3.2 - (c % 4) * 1.4,
          vy: 2.8 + (c % 3) * 1.6,
          vz: Math.sin(ang) * 5.8,
          rx: (c % 2 === 0 ? 1 : -1) * 3.4,
          rz: (c % 3 - 1) * 2.9
        });
      }

      // ------------------------------------------------------------------------
      // 8C. DESTRUCTIBLE & ROLLING FIELD BOULDERS
      // ------------------------------------------------------------------------
      function createFieldBoulder(x, z, radius, shatterTime = 999) {
        const y = getTerrainHeight(x, z);
        const geo = new THREE.DodecahedronGeometry(radius, 1);
        const pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const n = 0.84 + 0.28 * Math.sin(i * 3.7 + x);
          pos.setXYZ(i, pos.getX(i) * n * 1.15, pos.getY(i) * n * 0.82, pos.getZ(i) * n);
        }
        geo.computeVertexNormals();
        const mesh = new THREE.Mesh(geo, stoneMat);
        mesh.position.set(x, y + radius * 0.55, z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);

        const shards = [];
        for (let s = 0; s < 12; s++) {
          const shard = new THREE.Mesh(new THREE.DodecahedronGeometry(radius * (0.22 + (s % 3) * 0.08), 0), stoneMat);
          shard.visible = false;
          shard.castShadow = true;
          scene.add(shard);
          const ang = (s / 12) * Math.PI * 2;
          shards.push({
            mesh: shard,
            vx: Math.cos(ang) * (4.2 + (s % 3) * 1.5),
            vy: 3.6 + (s % 4) * 1.2,
            vz: Math.sin(ang) * (4.2 + (s % 3) * 1.5),
            rx: (s % 2 === 0 ? 1 : -1) * 6.5,
            rz: (s % 3 - 1) * 5.8
          });
        }
        return { mesh, shards, origin: new THREE.Vector3(x, y + radius * 0.55, z), radius, shatterTime };
      }

      // Boulder 1: Shattered by Prime's Crimson Blaze punch at t = 46.2s
      const primeShatterBoulder = createFieldBoulder(9.2, 4.2, 1.35, 46.2);
      // Boulder 2: Damen's Cowboy Hat landing boulder in Act 5 (t = 74.2s)
      const hatLandingBoulder = createFieldBoulder(11.4, 8.2, 1.15, 999);
      // Boulder 3: Northern stream bank rock outcrop where Khen stands in Act 1
      const khenIntroRock = createFieldBoulder(4.8, -14.8, 1.25, 999);
      // Boulder 4: Rolling boulder pushed across clearing in Act 4 (t = 49.5s)
      const rollingBoulder = createFieldBoulder(5.5, -5.8, 1.15, 999);

      // ------------------------------------------------------------------------
      // 9. ULTRA-LIGHTWEIGHT STATIC 110-TUFT OUTER GRASS (ZERO PER-FRAME CPU LAG)
      // ------------------------------------------------------------------------
      function buildSparseOuterGrass() {
        const positions = new Float32Array([
          -0.04, 0.0, 0.0,   0.04, 0.0, 0.0,   0.0, 0.42, 0.03,
          -0.06, 0.0, 0.02, -0.01, 0.0, -0.02, -0.14, 0.34, 0.05,
           0.01, 0.0, -0.02, 0.06, 0.0, 0.02,   0.14, 0.36, -0.04
        ]);
        const colors = new Float32Array([
          0.25, 0.45, 0.14,  0.25, 0.45, 0.14,  0.68, 0.78, 0.24,
          0.22, 0.42, 0.12,  0.22, 0.42, 0.12,  0.62, 0.74, 0.22,
          0.24, 0.44, 0.13,  0.24, 0.44, 0.13,  0.66, 0.76, 0.24
        ]);
        const tuftGeo = new THREE.BufferGeometry();
        tuftGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        tuftGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        tuftGeo.computeVertexNormals();

        const tuftMat = new THREE.MeshStandardMaterial({
          vertexColors: true,
          roughness: 0.75,
          side: THREE.DoubleSide
        });

        const TUFT_COUNT = 110;
        const instancedTufts = new THREE.InstancedMesh(tuftGeo, tuftMat, TUFT_COUNT);
        const dummy = new THREE.Object3D();

        const anchors = [
          templeOrigin,
          cliffOrigin,
          hatLandingBoulder.origin,
          khenIntroRock.origin,
          new THREE.Vector3(-8.0, 0, 14.5),
          new THREE.Vector3(0.0, 0, 14.5),
          new THREE.Vector3(8.0, 0, 14.5)
        ];

        for (let i = 0; i < TUFT_COUNT; i++) {
          const anchor = anchors[i % anchors.length];
          const ang = (i * 2.39996) % (Math.PI * 2);
          const dist = 1.4 + ((i * 7) % 24) * 0.12;
          let gx = anchor.x + Math.cos(ang) * dist;
          let gz = anchor.z + Math.sin(ang) * dist;
          const centerR = Math.hypot(gx, gz);
          if (centerR < 11.8) {
            gx = (gx / Math.max(0.01, centerR)) * 12.6;
            gz = (gz / Math.max(0.01, centerR)) * 12.6;
          }
          const gy = getTerrainHeight(gx, gz);
          dummy.position.set(gx, gy - 0.02, gz);
          dummy.rotation.set(0, (i * 1.7) % (Math.PI * 2), 0);
          const s = 0.85 + (i % 5) * 0.18;
          dummy.scale.set(s, s * (0.9 + (i % 3) * 0.2), s);
          dummy.updateMatrix();
          instancedTufts.setMatrixAt(i, dummy.matrix);
        }
        instancedTufts.instanceMatrix.needsUpdate = true;
        scene.add(instancedTufts);
      }
      buildSparseOuterGrass();

      // Lightweight Golden Pollen Motes
      const POLLEN_COUNT = 120;
      const pollenGeo = new THREE.BufferGeometry();
      const pollenPos = new Float32Array(POLLEN_COUNT * 3);
      for (let i = 0; i < POLLEN_COUNT; i++) {
        pollenPos[i * 3] = (Math.random() - 0.5) * 52;
        pollenPos[i * 3 + 1] = 0.6 + Math.random() * 9.0;
        pollenPos[i * 3 + 2] = (Math.random() - 0.5) * 52;
      }
      pollenGeo.setAttribute('position', new THREE.BufferAttribute(pollenPos, 3));
      const pollenMat = new THREE.PointsMaterial({
        color: 0xfef08a,
        size: 0.14,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending
      });
      scene.add(new THREE.Points(pollenGeo, pollenMat));

      // ------------------------------------------------------------------------
      // 10. FULL MULTI-JOINT ARTICULATED 3D ANIME FIGHTERS
      // ------------------------------------------------------------------------
      const FIGHTER_CONFIGS = [
        { id: 'marjohn', name: 'MARJOHN', title: 'Azure Wind', color: '#38bdf8', hex: 0x38bdf8, startX: -6, koTime: 42.2 },
        { id: 'prime',   name: 'PRIME',   title: 'Crimson Blaze', color: '#f43f5e', hex: 0xf43f5e, startX: -3, koTime: 58.2 },
        { id: 'damen',   name: 'DAMEN',   title: 'Golden Outlaw', color: '#f59e0b', hex: 0xf59e0b, startX:  0, koTime: 75.0 },
        { id: 'khen',    name: 'KHEN',    title: 'Arcane Violet', color: '#a855f7', hex: 0xa855f7, startX:  3, koTime: 109.0 },
        { id: 'jm',      name: 'JM',      title: 'Golden Sovereign', color: '#facc15', hex: 0xfacc15, startX:  6, koTime: null }
      ];

      function createArticulatedFighter(cfg) {
        const root = new THREE.Group();
        root.position.set(cfg.startX, 0, 0);
        scene.add(root);

        const squashGroup = new THREE.Group();
        root.add(squashGroup);

        const skinMat = new THREE.MeshStandardMaterial({ color: 0xfde2c4, roughness: 0.55 });
        const blackRobeMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.62 });
        const goldTrimMat = new THREE.MeshStandardMaterial({
          color: 0xfacc15,
          emissive: 0xb45309,
          emissiveIntensity: 0.25,
          metalness: 0.72,
          roughness: 0.28
        });
        const accentMat = new THREE.MeshStandardMaterial({
          color: cfg.hex,
          emissive: cfg.hex,
          emissiveIntensity: 0.45,
          roughness: 0.35
        });

        // Pelvis/Hips & Independently Articulated Spine/Torso
        const hips = new THREE.Group();
        hips.position.y = 0.92;
        squashGroup.add(hips);

        const torso = new THREE.Group();
        hips.add(torso);

        if (cfg.id === 'damen') {
          const shirt = new THREE.Mesh(
            new THREE.CylinderGeometry(0.23, 0.20, 0.58, 12),
            new THREE.MeshStandardMaterial({ map: plaidTex, roughness: 0.75 })
          );
          shirt.position.y = 0.29;
          shirt.castShadow = true;
          torso.add(shirt);

          const leatherMat = new THREE.MeshStandardMaterial({ color: 0x5c3317, roughness: 0.68 });
          const coatBack = new THREE.Mesh(
            new THREE.CylinderGeometry(0.26, 0.25, 0.62, 12, 1, false, Math.PI * 0.22, Math.PI * 1.56),
            leatherMat
          );
          coatBack.position.y = 0.30;
          coatBack.castShadow = true;
          torso.add(coatBack);

          const coatTail = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.48, 0.06), leatherMat);
          coatTail.position.set(0, -0.18, -0.18);
          coatTail.rotation.x = 0.18;
          torso.add(coatTail);
          cfg._coatTail = coatTail;
        } else {
          const robeChest = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.21, 0.60, 12), blackRobeMat);
          robeChest.position.y = 0.30;
          robeChest.castShadow = true;
          torso.add(robeChest);

          const trimCollar = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.024, 8, 20), goldTrimMat);
          trimCollar.rotation.x = Math.PI * 0.42;
          trimCollar.position.set(0, 0.56, 0.03);
          torso.add(trimCollar);

          const robeSkirt = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.31, 0.44, 14), blackRobeMat);
          robeSkirt.position.y = -0.16;
          robeSkirt.castShadow = true;
          hips.add(robeSkirt);

          const skirtGoldHem = new THREE.Mesh(new THREE.TorusGeometry(0.305, 0.018, 8, 24), goldTrimMat);
          skirtGoldHem.rotation.x = Math.PI * 0.5;
          skirtGoldHem.position.y = -0.37;
          hips.add(skirtGoldHem);

          if (cfg.id === 'jm') {
            const innerCollar = new THREE.Mesh(
              new THREE.CylinderGeometry(0.16, 0.17, 0.12, 12),
              new THREE.MeshStandardMaterial({ color: 0x7dd3fc, roughness: 0.5 })
            );
            innerCollar.position.set(0, 0.58, 0.02);
            torso.add(innerCollar);

            const lanyardMat = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, metalness: 0.6, roughness: 0.3 });
            const strapL = new THREE.Mesh(new THREE.BoxGeometry(0.022, 0.34, 0.015), lanyardMat);
            strapL.position.set(-0.06, 0.41, 0.21);
            strapL.rotation.z = -0.22;
            torso.add(strapL);

            const strapR = new THREE.Mesh(new THREE.BoxGeometry(0.022, 0.34, 0.015), lanyardMat);
            strapR.position.set(0.06, 0.41, 0.21);
            strapR.rotation.z = 0.22;
            torso.add(strapR);

            const idBadge = new THREE.Mesh(
              new THREE.BoxGeometry(0.11, 0.16, 0.015),
              new THREE.MeshStandardMaterial({ map: idTex, roughness: 0.35 })
            );
            idBadge.position.set(0, 0.21, 0.235);
            torso.add(idBadge);
            cfg._idBadge = idBadge;

            const goldSash = new THREE.Mesh(new THREE.CylinderGeometry(0.235, 0.235, 0.11, 14), goldTrimMat);
            goldSash.position.y = 0.03;
            torso.add(goldSash);

            const ribbonL = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.65, 0.015), goldTrimMat);
            ribbonL.position.set(-0.14, -0.32, -0.22);
            torso.add(ribbonL);
            const ribbonR = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.65, 0.015), goldTrimMat);
            ribbonR.position.set(0.14, -0.32, -0.22);
            torso.add(ribbonR);
            cfg._sashRibbons = [ribbonL, ribbonR];
          }
        }

        // Head, Hair & Expressive Anime Eyes
        const head = new THREE.Group();
        head.position.y = 0.78;
        torso.add(head);

        const skull = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 14), skinMat);
        skull.castShadow = true;
        head.add(skull);

        const hairColor =
          cfg.id === 'prime' ? 0x1f1218 :
          cfg.id === 'khen'  ? 0x1e1b4b :
          cfg.id === 'damen' ? 0x291d12 : 0x0f172a;
        const hairMat = new THREE.MeshStandardMaterial({ color: hairColor, roughness: 0.55 });
        const hairCap = new THREE.Mesh(new THREE.SphereGeometry(0.255, 14, 12, 0, Math.PI * 2, 0, Math.PI * 0.62), hairMat);
        hairCap.rotation.x = -0.22;
        head.add(hairCap);

        for (let h = 0; h < 7; h++) {
          const spike = new THREE.Mesh(new THREE.ConeGeometry(0.075, 0.24, 6), h % 2 === 0 ? hairMat : accentMat);
          const ang = (h / 7) * Math.PI * 2;
          spike.position.set(Math.cos(ang) * 0.17, 0.16, Math.sin(ang) * 0.17);
          spike.rotation.z = -Math.cos(ang) * 0.65;
          spike.rotation.x = Math.sin(ang) * 0.65;
          head.add(spike);
        }

        const eyeTex = createAnimeEyeTexture(cfg.color);
        const eyeMat = new THREE.MeshBasicMaterial({ map: eyeTex, transparent: true });
        const eyeL = new THREE.Mesh(new THREE.PlaneGeometry(0.085, 0.085), eyeMat);

        const eyeR = new THREE.Mesh(new THREE.PlaneGeometry(0.085, 0.085), eyeMat);

        eyeR.rotation.y = 0.22;
        head.add(eyeR);

        const browMat = new THREE.MeshBasicMaterial({ color: 0x0f172a });
        const browL = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.018, 0.015), browMat);
        browL.position.set(-0.085, 0.065, 0.234);
        browL.rotation.z = -0.22;
        head.add(browL);

        const browR = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.018, 0.015), browMat);
        browR.position.set(0.085, 0.065, 0.234);
        browR.rotation.z = 0.22;
        head.add(browR);

        // DAMEN: Detachable Wide-Brimmed Black Cowboy Hat
        let cowboyHat = null;
        if (cfg.id === 'damen') {
          cowboyHat = new THREE.Group();
          cowboyHat.position.set(0, 0.22, 0);
          const hatBlack = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.72 });

          const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.22, 0.20, 16), hatBlack);
          crown.position.y = 0.10;
          crown.castShadow = true;
          cowboyHat.add(crown);

          const hatBand = new THREE.Mesh(new THREE.CylinderGeometry(0.225, 0.225, 0.032, 16), goldTrimMat);
          hatBand.position.y = 0.025;
          cowboyHat.add(hatBand);

          head.add(cowboyHat);
        }

        // KHEN: Dark-rimmed rectangular 3D glasses + white anime cross-glint flare
        let glassesGlint = null;
        if (cfg.id === 'khen') {
          const frameMat = new THREE.MeshStandardMaterial({ color: 0x090d16, roughness: 0.3 });
          const lensMat = new THREE.MeshStandardMaterial({
            color: 0xe9d5ff,
            emissive: 0xa855f7,

            transparent: true,

          [-0.084, 0.084].forEach((gx) => {
            const rim = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.065, 0.015), frameMat);
            rim.position.set(gx, 0.015, 0.246);
            head.add(rim);
            const lens = new THREE.Mesh(new THREE.PlaneGeometry(0.092, 0.048), lensMat);
            lens.position.set(gx, 0.015, 0.255);
            head.add(lens);
          });
          const bridge = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.014, 0.015), frameMat);
          bridge.position.set(0, 0.022, 0.248);
          head.add(bridge);

          glassesGlint = new THREE.Group();
          glassesGlint.position.set(0.085, 0.02, 0.265);
          glassesGlint.visible = false;
          const glintMat = new THREE.MeshBasicMaterial({
            color: 0xffffff,

          const barH = new THREE.Mesh(new THREE.PlaneGeometry(0.50, 0.035), glintMat);

          glassesGlint.add(barH, barV);

        // TWO-SEGMENT ARTICULATED LIMBS (Shoulder->Elbow->Hand & Hip->Knee->Foot)
        function createArticulatedLimb(isArm, side) {
          const rootPivot = new THREE.Group();
          const upperLen = isArm ? 0.27 : 0.40;
          const lowerLen = isArm ? 0.26 : 0.39;
          const radTop = isArm ? 0.074 : 0.105;
          const radMid = isArm ? 0.065 : 0.088;
          const radBot = isArm ? 0.056 : 0.076;

          let limbMat = blackRobeMat;
          if (!isArm && cfg.id === 'damen') {
            limbMat = new THREE.MeshStandardMaterial({ color: 0x1d4ed8, roughness: 0.75 });
          } else if (isArm && cfg.id === 'damen') {
            limbMat = new THREE.MeshStandardMaterial({ color: 0x5c3317, roughness: 0.68 });
          }

          const upperMesh = new THREE.Mesh(new THREE.CylinderGeometry(radTop, radMid, upperLen, 10), limbMat);
          upperMesh.position.y = -upperLen * 0.5;
          upperMesh.castShadow = true;
          rootPivot.add(upperMesh);

          const jointSphere = new THREE.Mesh(new THREE.SphereGeometry(radMid * 0.96, 8, 8), limbMat);
          jointSphere.position.y = -upperLen;
          rootPivot.add(jointSphere);

          const midPivot = new THREE.Group();
          midPivot.position.y = -upperLen;
          rootPivot.add(midPivot);

          const lowerMesh = new THREE.Mesh(new THREE.CylinderGeometry(radMid, radBot, lowerLen, 10), limbMat);
          lowerMesh.position.y = -lowerLen * 0.5;
          lowerMesh.castShadow = true;
          midPivot.add(lowerMesh);

          if (!isArm && cfg.id === 'damen') {
            const chapMat = new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.72 });
            const chapUpper = new THREE.Mesh(new THREE.BoxGeometry(0.045, upperLen * 0.9, 0.11), chapMat);
            chapUpper.position.set(side * 0.088, -upperLen * 0.5, 0);
            rootPivot.add(chapUpper);

            const chapLower = new THREE.Mesh(new THREE.BoxGeometry(0.045, lowerLen * 0.9, 0.10), chapMat);
            chapLower.position.set(side * 0.082, -lowerLen * 0.5, 0);
            midPivot.add(chapLower);
          }

          const endMount = new THREE.Group();
          endMount.position.y = -lowerLen;
          midPivot.add(endMount);

          if (isArm) {
            if (cfg.id === 'prime') {
              const gauntlet = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.21, 0.17), accentMat);
              gauntlet.position.y = 0.02;
              gauntlet.castShadow = true;
              endMount.add(gauntlet);
            } else {
              const hand = new THREE.Mesh(new THREE.SphereGeometry(0.065, 10, 10), skinMat);
              endMount.add(hand);
            }
          } else {
            if (cfg.id === 'jm') {
              const sneaker = new THREE.Mesh(
                new THREE.BoxGeometry(0.16, 0.11, 0.28),
                new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.35 })
              );
              sneaker.position.set(0, -0.04, 0.05);
              sneaker.castShadow = true;
              endMount.add(sneaker);
            } else if (cfg.id === 'prime') {
              const greave = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.24, 0.25), accentMat);
              greave.position.set(0, 0.03, 0.03);
              greave.castShadow = true;
              endMount.add(greave);
            } else {
              const boot = new THREE.Mesh(
                new THREE.BoxGeometry(0.15, 0.14, 0.26),
                new THREE.MeshStandardMaterial({ color: cfg.id === 'damen' ? 0x451a03 : 0x090d16, roughness: 0.6 })
              );
              boot.position.set(0, -0.03, 0.04);
              boot.castShadow = true;
              endMount.add(boot);
            }
          }
          return { rootPivot, midPivot, endMount };
        }

        const armLObj = createArticulatedLimb(true, -1);
        armLObj.rootPivot.position.set(-0.31, 0.52, 0);
        torso.add(armLObj.rootPivot);

        const armRObj = createArticulatedLimb(true, 1);
        armRObj.rootPivot.position.set(0.31, 0.52, 0);
        torso.add(armRObj.rootPivot);

        const legLObj = createArticulatedLimb(false, -1);
        legLObj.rootPivot.position.set(-0.13, -0.04, 0);
        hips.add(legLObj.rootPivot);

        const legRObj = createArticulatedLimb(false, 1);
        legRObj.rootPivot.position.set(0.13, -0.04, 0);
        hips.add(legRObj.rootPivot);

        // Signature Weapons Attached to Articulated Hand Mounts
        const weapons = {};

        if (cfg.id === 'marjohn') {
          const staffGroup = new THREE.Group();
          armRObj.endMount.add(staffGroup);

          const shaft = new THREE.Mesh(
