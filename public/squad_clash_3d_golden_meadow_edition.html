            solarBeamGroup.scale.set(bp, 1.0 + Math.sin(t * 35) * 0.12, 1.0 + Math.cos(t * 35) * 0.12);
            dragonHead.position.set(-14.5 * bp, Math.sin(t * 24) * 0.25, Math.cos(t * 24) * 0.25);

            actionPointLight.color.setHex(0xfacc15);
            actionPointLight.position.set(-1.5, 2.2, 0);
            actionPointLight.intensity = 7.8;

            if (t >= 105.02 && t <= 105.15 && !isScrub) {
              triggerMilestone('solar-dragon-beam-sfx', () => audioEngine.playEvent('solar-dragon-beam', 'beam'));
            }
            if (t >= 108.95 && t <= 109.1 && !isScrub) {
              triggerCallout('khen-ko', 'KHEN KO!', '#a855f7', true);
              audioEngine.playEvent('khen-ko-sfx', 'ko');
            }
          }

          const khenAct7 = evaluateTrack([
            { t: 94.0,  x: -5.2, y: 0.0,  z: 0, rotY: 1.57, hipY: -0.14, armLAngle: [-0.65, 0.32, -0.35], elbowL: -1.42, armRAngle: [-0.65, -0.32, 0.35], elbowR: -1.42, eyeState: 'fierce', auraOpacity: 0.9, active: true },
            // Aerial Clash -> Guard broken by JM at 96.20s
            { t: 95.30, x: -3.8, y: 2.1,  z: 0, rotY: 1.57, arcY: 0.4, armLAngle: [-1.45, 0.45, -0.2], elbowL: -1.1, armRAngle: [-1.45, -0.45, 0.2], elbowR: -1.1, auraOpacity: 0.95, active: true, ease: Ease.outCubic },
            { t: 96.20, x: -3.4, y: 2.25, z: 0, rotY: 1.57, leanX: -0.35, eyeState: 'shock', auraOpacity: 0.85, active: true },
            // Drops back & launches Crescent Wave (97.5-98.8s)
            { t: 97.50, x: -5.8, y: 0.0,  z: 0, rotY: 1.57, hipY: -0.2, torsoPitch: 0.28, torsoYaw: -0.5, armLAngle: [-1.55, 0.2, -0.2], elbowL: -0.2, armRAngle: [-1.55, -0.2, 0.2], elbowR: -0.2, eyeState: 'fierce', auraOpacity: 0.95, active: true, ease: Ease.outCubic },
            { t: 104.9, x: -5.8, y: 0.0,  z: 0, rotY: 1.57, hipY: -0.18, torsoPitch: 0.22, armLAngle: [-1.45, 0.45, -0.2], elbowL: -1.25, armRAngle: [-1.45, -0.45, 0.2], elbowR: -1.25, eyeState: 'fierce', auraOpacity: 0.88, active: true },
            // Hit by Solar Dragon Beam at 105.90s -> skids back to (-9.8, 0, 0) -> dissolves at 107.6-109.6s
            { t: 105.90, x: -5.8, y: 0.0, z: 0, rotY: 1.57, leanX: -0.35, armLAngle: [-1.45, 0.45, -0.2], elbowL: -1.2, armRAngle: [-1.45, -0.45, 0.2], elbowR: -1.2, eyeState: 'shock', auraOpacity: 0.72, active: true },
            { t: 107.60, x: -9.8, y: 0.2, z: 0, rotY: 1.57, leanX: -0.35, armLAngle: [-1.1, 0, -0.6], elbowL: -0.5, armRAngle: [-1.1, 0, 0.6], elbowR: -0.5, eyeState: 'shock', auraOpacity: 0.35, active: true, ease: Ease.outCubic },
            { t: 109.00, x: -9.8, y: 0.65, z: 0, rotY: 1.57, leanX: -0.55, armLAngle: [-1.1, 0, -0.6], elbowL: -0.5, armRAngle: [-1.1, 0, 0.6], elbowR: -0.5, eyeState: 'ko', auraOpacity: 0, bodyOpacity: 0.25, active: false }
          ], t);

          const jmAct7 = evaluateTrack([
            { t: 94.0,  x: 5.2,  y: 0.0,  z: 0, rotY: -1.57, hipY: -0.14, armLAngle: [-0.75, 0.25, -0.28], elbowL: -1.35, armRAngle: [-0.55, -0.25, 0.28], elbowR: -1.25, eyeState: 'fierce', auraOpacity: 0.92, active: true },
            // Aerial Guard Break at 96.20s
            { t: 96.20, x: -2.4, y: 2.25, z: 0, rotY: -1.57, leanX: 0.42, torsoYaw: -0.65, armRAngle: [-1.62, -0.1, 0.1], elbowR: -0.14, legLAngle: [-0.45, 0, -0.12], kneeL: 0.75, legRAngle: [0.35, 0, 0.12], kneeR: 0.45, eyeState: 'fierce', auraOpacity: 0.96, active: true, ease: Ease.snap },
            // Grazing hit from Crescent Wave at 98.80s
            { t: 98.80, x: 4.2,  y: 2.0,  z: 0, rotY: -1.57, leanX: -0.2, auraOpacity: 0.9, active: true, ease: Ease.outCubic },
            // Ascends to (6.2, 3.4, 0) & deflects Crescent Wave at 102.60s
            { t: 101.6, x: 6.2,  y: 3.1,  z: 0, rotY: -1.57, leanX: -0.12, armLAngle: [-0.85, 0.55, -0.3], elbowL: -1.45, armRAngle: [-0.85, -0.55, 0.3], elbowR: -1.45, eyeState: 'fierce', auraOpacity: 0.98, active: true },
            { t: 102.60, x: 6.2, y: 3.4,  z: 0, rotY: -1.57, leanX: 0.08, armLAngle: [-0.85, 0.55, -0.3], elbowL: -1.45, armRAngle: [-1.58, -0.1, 0.1], elbowR: -0.12, eyeState: 'fierce', auraOpacity: 1.0, active: true, ease: Ease.snap },
            // Draws both hands back charging Solar Dragon Sphere -> fires Solar Dragon Beam at 105.0s!
            { t: 104.85, x: 6.2, y: 3.4,  z: 0, rotY: -1.57, leanX: -0.18, torsoYaw: 0.45, armLAngle: [-0.85, 0.55, -0.3], elbowL: -1.45, armRAngle: [-0.85, -0.55, 0.3], elbowR: -1.45, eyeState: 'fierce', auraOpacity: 1.0, active: true },
            { t: 105.10, x: 6.2, y: 3.4,  z: 0, rotY: -1.57, leanX: 0.24, torsoYaw: 0.0, armLAngle: [-1.57, 0.12, -0.14], elbowL: -0.12, armRAngle: [-1.57, -0.12, 0.14], elbowR: -0.12, legLAngle: [-0.55, 0, -0.15], kneeL: 0.85, legRAngle: [0.35, 0, 0.15], kneeR: 0.45, eyeState: 'fierce', auraOpacity: 1.0, active: true, ease: Ease.snap },
            { t: 110.00, x: 6.2, y: 3.4,  z: 0, rotY: -1.57, leanX: 0.22, armLAngle: [-1.57, 0.12, -0.14], elbowL: -0.12, armRAngle: [-1.57, -0.12, 0.14], elbowR: -0.12, legLAngle: [-0.55, 0, -0.15], kneeL: 0.85, legRAngle: [0.35, 0, 0.15], kneeR: 0.45, eyeState: 'fierce', auraOpacity: 1.0, active: true }
          ], t);

          commitPose('khen', khenAct7);
          commitPose('jm', jmAct7);

          if (t < 100.5) {
            camDest.set(0, 4.5, 16.0);
            lookDest.set(0, 2.0, 0);
          } else if (t < 105.0) {
            camDest.set(3.2, jmY + 1.8, 6.2);
            lookDest.set(6.0, jmY + 1.25, 0);
          } else {
            camDest.set(0.2, 4.4, 15.8);
            lookDest.set(-0.5, 1.8, 0);
          }
        }

        // ======================================================================
        // ACT 8 (110.0s – 120.0s): CHAMPION JM — GOLDEN SUNRISE & COMPOSED VICTORY POSE
        // ======================================================================
        else {
          commitPose('marjohn', {});
          commitPose('prime', {});
          commitPose('damen', {});
          commitPose('khen', {});

          document.getElementById('champion-banner').classList.remove('hidden');
          if (t >= 110.1 && t <= 110.3 && !isScrub) {
            triggerMilestone('champion-fanfare', () => {
              audioEngine.playEvent('champion-fanfare', 'victory');
              spawnShockwave(0, 0, 16.0, 0xfacc15, 1.15);
            });
          }

          if (fighters.jm.crownHalo) {
            fighters.jm.crownHalo.visible = true;
            fighters.jm.crownHalo.rotation.z = t * 1.1;
            fighters.jm.crownHalo.scale.setScalar(1.08 + Math.sin(t * 4) * 0.05);
          }

          const jmAct8 = evaluateTrack([
            { t: 110.0, x: 6.2, y: 3.4, z: 0, rotY: -1.57, leanX: 0.1, armLAngle: [-1.2, 0.2, -0.2], elbowL: -0.5, armRAngle: [-1.2, -0.2, 0.2], elbowR: -0.5, legLAngle: [-0.35, 0, -0.12], kneeL: 0.55, legRAngle: [0.25, 0, 0.12], kneeR: 0.45, eyeState: 'normal', auraOpacity: 0.92, active: true },
            { t: 112.5, x: 0.0, y: 0.0, z: 0, rotY: 0.12, leanX: -0.05, leanZ: 0.04, hipY: -0.04, torsoYaw: -0.14, headYaw: 0.12, eyeState: 'normal', auraOpacity: 0.78, active: true, armLAngle: [-1.42, 0.25, -0.22], elbowL: -0.35, armRAngle: [-1.48, -0.22, 0.18], elbowR: -0.32, legLAngle: [-0.18, 0.12, -0.10], kneeL: 0.28, legRAngle: [0.16, -0.12, 0.12], kneeR: 0.24, ease: Ease.outCubic },
            { t: 120.0, x: 0.0, y: 0.0, z: 0, rotY: 0.12, leanX: -0.05, leanZ: 0.04, hipY: -0.04, torsoYaw: -0.14, headYaw: 0.12, eyeState: 'normal', auraOpacity: 0.78, active: true, armLAngle: [-1.42, 0.25, -0.22], elbowL: -0.35, armRAngle: [-1.48, -0.22, 0.18], elbowR: -0.32, legLAngle: [-0.18, 0.12, -0.10], kneeL: 0.28, legRAngle: [0.16, -0.12, 0.12], kneeR: 0.24 }
          ], t);
          commitPose('jm', jmAct8);

          const orbitWin = (t - 110.0) * 0.22;
          const camRad = lerp(12.5, 5.4, smoothstep(110.0, 114.5, t));
          camDest.set(Math.sin(orbitWin) * camRad, lerp(4.8, 2.05, smoothstep(110.0, 114.5, t)), Math.cos(orbitWin) * camRad);
          lookDest.set(0, 1.32, 0);
        }

        // Update Fighter HUD Cards (HP + Deterministic 5-Phase Damage Status Label)
        FIGHTER_CONFIGS.forEach((cfg) => {
          const f = fighters[cfg.id];
          const card = document.getElementById(`hud-card-${cfg.id}`);
          const hpBar = document.getElementById(`hud-hp-${cfg.id}`);
          const hpNum = document.getElementById(`hud-hp-num-${cfg.id}`);
          const koBadge = document.getElementById(`hud-ko-${cfg.id}`);
          const phaseLabel = document.getElementById(`hud-phase-${cfg.id}`);

          hpBar.style.width = `${Math.round(f.hp)}%`;
          hpNum.textContent = `${Math.round(f.hp)}%`;
          if (phaseLabel) {
            phaseLabel.textContent = f.phase;
            phaseLabel.className = 'truncate font-semibold ' + (
              f.phase === 'DEFEATED' ? 'text-rose-500 font-extrabold' :
              f.phase === 'CRITICAL' ? 'text-rose-400 font-bold' :
              f.phase === 'SEVERELY DAMAGED' ? 'text-orange-400' :
              f.phase === 'DAMAGED' ? 'text-amber-300' :
              'text-slate-300'
            );
          }

          if (f.isKO) {
            koBadge.classList.remove('hidden');
            card.style.opacity = '0.52';
            card.style.transform = 'scale(0.97)';
            card.style.boxShadow = '';
          } else {
            koBadge.classList.add('hidden');
            card.style.opacity = '1.0';
            card.style.transform = f.isActive ? 'scale(1.03)' : 'scale(1.0)';
            card.style.boxShadow = f.isActive ? `0 0 18px ${cfg.color}55` : '';
          }
        });

        // Update Camera Position according to Selected Mode ('auto' | 'orbit' | 'jm')
        camShakeSpring.update(dt);
        const shakeOffset = (Math.random() - 0.5) * camShakeSpring.value;

        if (cameraMode === 'auto') {
          camPosSpring.setTarget(camDest.x, camDest.y, camDest.z);
          camLookSpring.setTarget(lookDest.x, lookDest.y, lookDest.z);
          camPosSpring.update(dt);
          camLookSpring.update(dt);
          camera.position.set(
            camPosSpring.x.value + shakeOffset,
            camPosSpring.y.value + shakeOffset * 0.7,
            camPosSpring.z.value
          );
          camera.lookAt(camLookSpring.x.value, camLookSpring.y.value, camLookSpring.z.value);
        } else if (cameraMode === 'orbit') {
          const r = orbitState.radius;
          const sinPhi = Math.sin(orbitState.phi);
          const cosPhi = Math.cos(orbitState.phi);
          camera.position.set(
            orbitState.target.x + r * sinPhi * Math.sin(orbitState.theta) + shakeOffset,
            orbitState.target.y + r * cosPhi,
            orbitState.target.z + r * sinPhi * Math.cos(orbitState.theta)
          );
          camera.lookAt(orbitState.target);
        } else if (cameraMode === 'jm') {
          const jmPos = fighters.jm.root.position;
          const r = 6.8;
          camera.position.set(
            jmPos.x + Math.sin(orbitState.theta + 0.35) * r + shakeOffset,
            jmPos.y + 2.4,
            jmPos.z + Math.cos(orbitState.theta + 0.35) * r
          );
          camera.lookAt(jmPos.x, jmPos.y + 1.25, jmPos.z);
        }
      }

      // ------------------------------------------------------------------------
      // 15. LIGHTWEIGHT 60 FPS VFX & AMBIENCE UPDATE LOOP
      // ------------------------------------------------------------------------
      function updateVisualEffects(dt, elapsed) {
        for (let i = activeShockwaves.length - 1; i >= 0; i--) {
          const sw = activeShockwaves[i];
          sw.age += dt;
          if (sw.age >= sw.maxAge) {
            activeShockwaves.splice(i, 1);
          } else {
            sw.radius = lerp(0.5, sw.maxRadius, sw.age / sw.maxAge);
          }
        }
        shockwaveRingPool.forEach((ring, idx) => {
          if (idx < activeShockwaves.length) {
            const sw = activeShockwaves[idx];
            ring.visible = true;
            ring.position.set(sw.x, getTerrainHeight(sw.x, sw.z) + 0.14, sw.z);
            ring.scale.setScalar(sw.radius);
            ring.material.color.setHex(sw.colorHex);
            ring.material.opacity = (1.0 - sw.age / sw.maxAge) * 0.72;
          } else {
            ring.visible = false;
          }
        });

        slashArcPool.forEach((s) => {
          if (s.life > 0) {
            s.life -= dt;
            const ratio = Math.max(0, s.life / s.maxLife);
            s.mesh.material.opacity = ratio * 0.9;
            s.mesh.scale.multiplyScalar(1.0 + dt * 1.4);
            if (s.life <= 0) s.mesh.visible = false;
          }
        });

        hitSparkPool.forEach((sp) => {
          if (sp.life > 0) {
            sp.life -= dt;
            sp.mesh.position.x += sp.vx * dt;
            sp.mesh.position.y += sp.vy * dt;
            sp.mesh.position.z += sp.vz * dt;
            sp.vy -= 18.0 * dt;
            sp.mesh.material.opacity = Math.max(0, sp.life / sp.maxLife);
            if (sp.life <= 0) sp.mesh.visible = false;
          }
        });

        ghostPool.forEach((g) => {
          if (g.life > 0) {
            g.life -= dt;
            g.mesh.material.opacity = Math.max(0, (g.life / 0.28) * 0.5);
            if (g.life <= 0) g.mesh.visible = false;
          }
        });

        // Gentle wind sway on perimeter trees (22 meshes = zero CPU cost)
        swayingTrees.forEach((tr) => {
          tr.crown.rotation.z = Math.sin(elapsed * 1.4 + tr.phase) * 0.045;
          tr.crown.rotation.x = Math.cos(elapsed * 1.1 + tr.phase) * 0.035;
        });

        cloudsGroup.children.forEach((cl) => {
          cl.userData.angle += cl.userData.speed * dt;
          cl.position.x = Math.cos(cl.userData.angle) * cl.userData.radius;
          cl.position.z = Math.sin(cl.userData.angle) * cl.userData.radius;
        });

        const pArr = pollenGeo.attributes.position.array;
        for (let i = 0; i < POLLEN_COUNT; i++) {
          pArr[i * 3] += (0.45 + Math.sin(elapsed + i) * 0.2) * dt;
          pArr[i * 3 + 1] += Math.sin(elapsed * 1.5 + i * 0.7) * 0.18 * dt;
          if (pArr[i * 3] > 26) pArr[i * 3] = -26;
        }
        pollenGeo.attributes.position.needsUpdate = true;

        streamMat.emissiveIntensity = 0.22 + Math.sin(elapsed * 3.0) * 0.08;

        fireworks.forEach((fw) => {
          const age = simTime - fw.triggerTime;
          if (simTime >= 110.0 && age >= 0 && age < 2.4) {
            fw.points.material.opacity = 1.0 - age / 2.4;
            const arr = fw.points.geometry.attributes.position.array;
            for (let p = 0; p < fw.dirs.length; p++) {
              const d = fw.dirs[p];
              arr[p * 3] = fw.origin.x + d.x * age * 4.8;
              arr[p * 3 + 1] = fw.origin.y + d.y * age * 4.8 - 1.2 * age * age;
              arr[p * 3 + 2] = fw.origin.z + d.z * age * 4.8;
            }
            fw.points.geometry.attributes.position.needsUpdate = true;
          } else {
            fw.points.material.opacity = 0;
          }
        });
      }

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      let lastFrameTime = performance.now();
      let totalElapsed = 0;

      updateSimulation(0.016, true);

      function animate(now) {
        requestAnimationFrame(animate);
        const rawDt = Math.min((now - lastFrameTime) / 1000, 0.05);
        lastFrameTime = now;
        totalElapsed += rawDt;

        const mangaEl = document.getElementById('manga-flash');
        if (mangaFlashTimer > 0) {
          mangaFlashTimer -= rawDt;
          mangaEl.style.opacity = '1';
        } else {
          mangaEl.style.opacity = '0';
        }

        let effectiveDt = rawDt * playbackSpeed;
        if (hitStopTimer > 0) {
          hitStopTimer -= rawDt;
          effectiveDt = 0;
        }

        if (isPlaying) {
          simTime += effectiveDt;
          if (simTime >= TOTAL_DURATION) {
            simTime = TOTAL_DURATION;
            setPlayingState(false);
          }
          updateSimulation(effectiveDt > 0 ? effectiveDt : 0.001, false);
        } else {
          updateSimulation(rawDt, true);
        }

        updateVisualEffects(rawDt, totalElapsed);
        renderer.render(scene, camera);
      }

      requestAnimationFrame(animate);
    };
  </script>
</body>
</html>
